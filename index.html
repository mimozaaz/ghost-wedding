<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>คืนวิวาห์ผี v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0809;--panel:#16100f;--soft:#211816;--line:#3a2a26;--ink:#efe4d6;--muted:#a8968a;--red:#c0262f;--red2:#7d151b;--gold:#d8aa4f;--green:#5fa05a;--blue:#5a8ec0;--purple:#9a63c9;
--display:'Kanit',sans-serif;--body:'Sarabun',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at top,#2a0e10 0%,var(--bg) 60%) fixed}
.wrap{max-width:520px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 40px max(14px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2}
h1{font-size:30px;color:var(--gold);text-shadow:0 0 18px rgba(192,38,47,.6)}
h2{font-size:20px}
h3{font-size:16px;color:var(--gold)}
p{margin:0}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.btn{font:600 15px/1.3 var(--body);border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:11px;padding:11px 14px;min-height:46px;cursor:pointer;text-align:left;width:100%}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.pri{background:var(--red);border-color:transparent;color:#fff;text-align:center;font-family:var(--display);font-size:17px}
.btn.c{text-align:center}
.btn[aria-pressed="true"]{border-color:var(--gold);background:#2d2014;box-shadow:inset 0 0 0 1px var(--gold)}
.btn small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.day{font-family:var(--display);font-size:24px;color:var(--gold)}
.bars{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 10px}
.bar.low .lab b{color:#ff6b6b}.bar.low .track{box-shadow:0 0 0 1px #ff4d4d;animation:pl 1s infinite}@keyframes pl{50%{opacity:.55}}
.warns{display:flex;gap:4px;flex-wrap:wrap}.warn{background:#5a1218;color:#ffd0d0;border-radius:8px;padding:1px 7px;font-size:12px;animation:pl 1.2s infinite}
.cstats{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.cstats span{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:14px;font-variant-numeric:tabular-nums}.cstats span.low{border-color:#ff4d4d;color:#ffb3b3}
.chip.tap{cursor:pointer}
.bar{display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.bar .lab{display:flex;justify-content:space-between;color:var(--muted)}
.bar .lab b{color:var(--ink);font-variant-numeric:tabular-nums}
.track{height:7px;background:#000;border-radius:4px;overflow:hidden}
.fill{height:100%;border-radius:4px;transition:width .3s}
.power .track{height:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:13px}
.chip.relic{border-color:var(--gold);color:var(--gold)}
.chip.ally{border-color:var(--purple);color:#d4b5ef}
.log{display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.log p{padding-left:10px;border-left:2px solid var(--line)}
.log p.bad{border-color:var(--red);color:#f1b7b7}
.log p.good{border-color:var(--green);color:#bfe3bb}
.log p.gold{border-color:var(--gold);color:#f0d9a6}
.log p.pink{border-color:var(--purple);color:#e3c9f5}
.enemy{text-align:center;padding:16px 10px;background:linear-gradient(#1e0b0c,#120a0a);border:1px solid var(--red2);border-radius:14px}
.enemy .art svg{width:100%;max-width:230px;height:auto;aspect-ratio:1;border-radius:12px;display:block;margin:0 auto;box-shadow:0 0 30px rgba(140,10,20,.35)}
.enemy .ico{font-size:52px;line-height:1}
.enemy h2{color:#f3a3a3;margin-top:6px}
.story{font-size:16px;line-height:1.7}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg .btn{text-align:center;padding:9px 4px}
.foot{font-size:12px;color:var(--muted);text-align:center}
.title-ico{font-size:64px;text-align:center}
details summary{cursor:pointer;color:var(--gold);font-family:var(--display)}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.merit{font-family:var(--display);color:var(--gold)}
.ach{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.ach:last-child{border:0}
.ach .ai{font-size:22px;width:30px;text-align:center;flex:none}
.ach.lock{opacity:.4}
.ach b{display:block}
.ach span{font-size:13px;color:var(--muted)}
.prog{height:6px;background:#000;border-radius:3px;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--gold)}
#toast{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);z-index:9;display:flex;flex-direction:column;gap:6px;width:min(92vw,420px);pointer-events:none}
#toast div{background:#2d2014;border:1px solid var(--gold);color:var(--gold);border-radius:12px;padding:10px 14px;font-family:var(--display);box-shadow:0 6px 24px rgba(0,0,0,.6);animation:tin .3s}
#toast small{display:block;color:var(--ink);font-family:var(--body)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
.sticky{position:sticky;top:0;z-index:5;margin:0 -14px;padding:max(8px,env(safe-area-inset-top)) 14px 10px;background:rgba(12,8,9,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sb-row{display:flex;align-items:center;gap:10px}
.sb-info{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.sb-info b{font-family:var(--display);color:var(--gold);font-size:17px}
.sb-info span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:44px;height:44px;flex:none;border-radius:11px;border:1px solid var(--line);background:var(--soft);font-size:18px;cursor:pointer}
.btn.go{width:auto;flex:none;padding:10px 18px;box-shadow:0 0 18px rgba(192,38,47,.45)}
.minis{display:grid;grid-template-columns:auto 1fr auto 1fr auto 1fr;gap:6px;align-items:center;font-size:12px}
.mtrack{height:5px;background:#000;border-radius:3px;overflow:hidden}
.mtrack i{display:block;height:100%}
.btn.tile{padding:10px 11px;font-size:14px}
.btn.tile small{font-size:12px;margin-top:2px}
.span2{grid-column:1/-1}
.loc .li{display:block;font-size:24px;line-height:1.1;margin-bottom:2px}
.badge{background:var(--red);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-left:4px;font-family:var(--body)}
.wrap>.sticky:first-child{margin-top:calc(-1 * max(14px,env(safe-area-inset-top)))}
.tabs{display:grid;grid-template-columns:.6fr 1fr 1fr 1fr 1fr;gap:6px}
.tabs .btn{text-align:center;padding:8px 2px;font-size:13px}
</style>
</head>
<body>
<div id="toast"></div>
<div class="wrap" id="app"></div>
<script>
'use strict';
const $app=document.getElementById('app');
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const ch=p=>Math.random()<p;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
(function(){const V='reset-2026-11-09';try{if(localStorage.getItem('gw__ver')!==V){Object.keys(localStorage).filter(k=>k.startsWith('gw_')).forEach(k=>localStorage.removeItem(k));localStorage.setItem('gw__ver',V)}}catch(e){}})();
const store={get(k,d){try{const v=localStorage.getItem('gw_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('gw_'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('gw_'+k)}catch(e){}}};

/* ---------- DATA ---------- */
const ITEMS={rice:'ข้าวสาร',water:'น้ำดื่ม',herb:'สมุนไพร',salt:'เกลือเสก',candle:'เทียนขี้ผึ้ง',holy:'น้ำมนต์',band:'ผ้าพันแผล',cloth:'ผ้าขาว',med:'ยาผีบอก',jar:'ขวดดินเผาขังผี'};
const WEAPONS=[{n:'มือเปล่า',d:[4,8]},{n:'มีดพร้า',d:[9,15]},{n:'ดาบเหล็กน้ำพี้',d:[14,22]},{n:'ดาบลงอาคม',d:[17,27],holy:1}];
const RELICS={
 sai:{n:'สายสิญจน์เก้าเส้น',fx:'ผีบุกตอนกลางคืนน้อยลง',core:1,st:'เก้าเส้นจากเก้าวัด หลวงปู่ผูกไว้รอบหมู่บ้านเมื่อร้อยปีก่อน เส้นเดียวที่ไม่ขาดคือเส้นนี้'},
 takrud:{n:'ตะกรุดโทนหนังเสือ',fx:'โดนตีเบาลง 3',core:1,st:'จารด้วยเลือดเสือสมิงที่ถูกปราบ หนังห่อยังอุ่นเหมือนมีชีวิต'},
 knife:{n:'มีดหมอเหล็กไหล',fx:'ตีบอสหมอผี +8',core:1,st:'มีดที่หมอผีใช้กรีดคอเจ้าสาวคนก่อนๆ เหล็กไหลจำเลือดเจ้าของได้ และมันเกลียดเจ้าของ'},
 yan:{n:'ผ้ายันต์ครู',fx:'คำสาปขึ้นช้าลง 30%',core:1,st:'หลวงตาเปลี่ยนลงยันต์ทั้งคืนจนเลือดกำเดาไหล ทุกอักขระคืออายุของท่านที่หายไป'},
 eye:{n:'ดวงตาพราย',fx:'รู้ตัวก่อนโดนซุ่ม',core:1,st:'ดวงตาข้างซ้ายของบัวลอย ยังกะพริบเองบางครั้ง และมองไปทางบึงเสมอ'},
 phong:{n:'ลูกแก้วผีโพง',fx:'โอกาสเจอของ +5%',loc:['bamboo'],st:'เรืองแสงสีเขียวในที่มืด คนโบราณเชื่อว่าใครถือไว้จะเห็นของที่ซ่อนอยู่'},
 comb:{n:'หวีงาช้างแม่นาค',fx:'สติ +3 ทุกคืน',loc:['swamp'],st:'หวีที่หญิงสาวคนหนึ่งใช้หวีผมรอผัวกลับจากศึก นางรอจนตาย และยังรอต่ออีกร้อยปี'},
 kong:{n:'ตะกรุดคงกระพัน',fx:'โดนตีเบาลงอีก 2',loc:['temple'],st:'ทหารเก้าสิบคนห้อยตะกรุดดอกนี้ต่อกันมา ไม่มีใครตายในสนามรบ แต่ไม่มีใครตายดีสักคน'},
 oil:{n:'น้ำมันพรายบริสุทธิ์',fx:'น้ำมนต์แรง +10',loc:['shrine'],st:'เคี่ยวจากคางสาวพรหมจรรย์ตายท้องกลม ของต้องห้ามที่สุดในตำราหมอผี แต่ถ้าเสกกลับด้าน มันคือยาแก้ผีชั้นเลิศ'},
 staff:{n:'ไม้เท้าครูหมอ',fx:'คาถาแรง ×1.5',loc:['temple'],st:'ไม้ตะเคียนจากต้นที่พระธุดงค์เคยนั่งปลงอาบัติ ใครถือแล้วท่องคาถา เสียงจะดังก้องเหมือนพระสวดร้อยรูป'},
 pracheat:{n:'ผ้าประเจียดแดง',fx:'กันการโจมตีแรกของทุกการต่อสู้',loc:['market'],st:'แม่ทุกคนในหมู่บ้านเย็บให้ลูกชายก่อนไปรบ ผืนนี้ไม่มีเจ้าของมารับคืน'},
 beads:{n:'ลูกประคำกระดูกเสือ',fx:'ฟัน +3',loc:['grave'],st:'นับครบร้อยแปดเม็ด แต่ละเม็ดมีรอยเขี้ยว ไม่มีใครรู้ว่าเสือตัวไหนยอมตายให้'},
 bia:{n:'เบี้ยแก้ป่าช้า',fx:'คำสาปขึ้นช้าลง 15%',loc:['grave'],st:'หอยเบี้ยอุดปรอทที่ฝังกับศพเด็ก ป้องกันไม่ให้วิญญาณเด็กถูกจับไปทำกุมาร'},
 kuman:{n:'กุมารทองเชื่อง',fx:'ช่วยตีทุกเทิร์น 5–10',loc:['shrine'],st:'กุมารทองที่หนีจากศาลหมอผี มันเรียกมึงว่าพ่อ และขอแค่น้ำแดงวันละแก้ว'},
 balm:{n:'สีผึ้งเมตตามหานิยม',fx:'ฟื้นชีวิต +3 ทุกคืน',loc:['market'],st:'ทาปากแล้วผีก็ยังใจอ่อน แม่ค้าตลาดเก่าทาไว้ทุกเช้า ตอนนี้นางยังเดินขายของอยู่ทุกคืน'},
 kwak:{n:'นางกวักไม้แกะ',fx:'ค้นเจอข้าวเพิ่ม +1 ทุกครั้ง',loc:['market'],st:'กวักเงินกวักทองไม่สำคัญ ในยามแบบนี้ กวักข้าวสักถุงก็พอ'},
 compass:{n:'เข็มทิศผีบอก',fx:'หนีสำเร็จทุกครั้ง',loc:['hospital'],st:'หมอประจำอนามัยใช้หาทางออกตอนผีบุก เข็มชี้ไปทางที่ไม่มีผีเสมอ แต่หมอไม่รอด'},
 yadong:{n:'ยาดองเสกสามรอบ',fx:'ยาและผ้าพันแผลฟื้น ×1.5',loc:['hospital'],st:'เหล้าขาวดองรากไม้เจ็ดชนิด ลุงภารโรงเสกไว้กินเอง รสชาติเหมือนน้ำมันเครื่อง'},
 pod:{n:'เงินพดด้วงผี',fx:'เล่นพนันชนะทุกครั้ง',loc:['bamboo'],st:'เงินที่ผีพนันใช้วางเดิมพัน ไม่มีใครเคยชนะมัน เพราะมันโกงไม่เป็นเลย'},
 rod:{n:'พระรอดเนื้อดิน',fx:'ชีวิตสูงสุด +15',loc:['temple'],st:'พระเครื่องเล็กเท่าเม็ดข้าวโพด ห้อยแล้วรถคว่ำไม่ตาย แต่ที่นี่ไม่มีรถให้คว่ำ'},
 fang:{n:'เขี้ยวเสือสมิง',fx:'คริติคอล +10%',loc:['bamboo'],st:'เขี้ยวที่หักคาคอผีหัวขาด ยังมีกลิ่นคาวเลือดติดอยู่'},
 mirror:{n:'กระจกเงาบานแตก',fx:'สติลดช้าลงตอนกลางคืน',loc:['hospital'],st:'กระจกในห้องผ่าตัด เงาในกระจกขยับช้ากว่าตัวจริงครึ่งวินาทีเสมอ'},
 mahaud:{n:'ตะกรุดมหาอุด',fx:'โดนตีเบาลง 1',loc:['temple'],st:'ปืนยิงไม่ออก มีดฟันไม่เข้า แต่กับผีมันได้แค่ทำให้เจ็บน้อยลงนิดหน่อย'},
 lotus:{n:'ดอกบัวสัตตบงกช',fx:'ฟื้นชีวิต +2 ทุกคืน',loc:['swamp'],st:'ดอกบัวที่ไม่เคยเหี่ยว บานกลางบึงตรงจุดที่บัวลอยจมน้ำตาย'},
 bell:{n:'กระดิ่งวัดร้าง',fx:'ผีบุกตอนกลางคืนน้อยลงอีก',loc:['temple'],st:'ห้อยอยู่ที่ชายคาโบสถ์ ไม่มีลมก็ดังเองทุกครั้งที่มีผีเข้าใกล้'},
 rope:{n:'เชือกผูกคอผีตายโหง',fx:'ฟันผี +4',loc:['market'],st:'เชือกป่านที่แม่ค้าคนหนึ่งใช้ผูกคอตายกลางตลาด ผีทุกตัวกลัวมันเพราะจำความเจ็บได้'},
 skull:{n:'กะโหลกผีเฝ้าทรัพย์',fx:'โอกาสเจอของ +4%',loc:['grave'],st:'กะโหลกที่ถูกฝังพร้อมไหทอง มันยังกระซิบบอกว่าของมีค่าซ่อนอยู่ตรงไหน'},
 needle:{n:'เข็มเย็บผ้าห่อศพ',fx:'ใช้ยาฟื้นเพิ่ม +5',loc:['hospital'],st:'เย็บศพมาแล้วสามร้อยศพ ตอนนี้เย็บแผลคนเป็นแทน'},
 tusk:{n:'งาช้างดำ',fx:'ชีวิตสูงสุด +10',loc:['bamboo'],st:'งาของช้างเผือกดำที่ตายกลางป่าไผ่ ปอบทุกตัวไม่กล้าเข้าใกล้'},
 flute:{n:'ขลุ่ยผีพราย',fx:'ศัตรู 15% เผลอเสียเทิร์น',loc:['swamp'],st:'เป่าแล้วไม่มีเสียง แต่ผีทุกตัวในรัศมีจะหยุดฟัง'},
 incense:{n:'ธูปเก้าดอกไม่มีวันมอด',fx:'สวดมนต์ได้สติเพิ่ม +4',loc:['shrine'],st:'หมอผีจุดไว้บูชาครู มันไหม้มาสามชั่วคน ยังไม่สั้นลงเลยสักนิ้ว'},
 third:{n:'ตาที่สามจากโลกเงา',fx:'คริติคอล +8% และไม่โดนซุ่ม',mad:1,st:'ของที่ติดมือกลับมาจากโลกคนบ้า มันมองเห็นสิ่งที่คนปกติไม่เห็น'},

function daily(){
 const d=today();
 if(!M.daily||M.daily.date!==d){
  let h=0;for(const c of d)h=(h*31+c.charCodeAt(0))>>>0;
  const ids=[];while(ids.length<3){h=(h*1103515245+12345)>>>0;const q=QPOOL[h%QPOOL.length].id;if(!ids.includes(q))ids.push(q)}
  M.daily={date:d,ids,prog:{},done:[],bonus:0};saveM();
 }
 return M.daily;
}
function qInc(k,n){
 n=n||1;const D=daily();
 if(!D.ids.includes(k)||D.done.includes(k))return;
 D.prog[k]=(D.prog[k]||0)+n;
 const q=QPOOL.find(x=>x.id===k);
 if(D.prog[k]>=q.n){D.done.push(k);gain(15);toast('ภารกิจรายวันสำเร็จ!',q.t+' · +15 บุญ');
  if(D.done.length===3&&!D.bonus){D.bonus=1;gain(25);toast('ครบ 3 ภารกิจวันนี้!','+25 บุญ');M.st.dailyFull=1}}
 saveM();
}
function gain(n){M.merit+=n;M.earned+=n;saveM()}
function kill(id){S.kp=(S.kp||0)+1;if(S.combat&&S.combat.nem){if(M.nemesis&&M.nemesis.skill){const ns=M.nemesis.skill;if((S.skills||[]).length<2)addSkill(ns.id,ns.bad,1);L('ได้วิชาของบรรพบุรุษคืนจากผีคู่แค้น: '+SK[ns.id].n,'gold')}M.nemesis=null;S.flags.nemDone=1;M.st.nemesis=1;saveM();L('ล้างแค้นผีคู่แค้นสำเร็จ!','gold');relicFind('case',1)}if(S.pets)for(const p of S.pets){p.xp++;if(p.xp>=3&&p.lvl<5){p.xp=0;p.lvl++;L(`${EN[p.id].i} ${EN[p.id].n}เลเวลอัปเป็น Lv${p.lvl}!`,'pink')}}M.st.kills[id]=(M.st.kills[id]||0)+1;M.st.total++;S.r.kills++;qInc('kill');qInc('k_'+id);saveM()}

function meritOf(e){return Math.round((hb('greed')?1.3:1)*(Math.floor(S.day*1.5)+S.r.kills+S.relics.length*4+S.disrupts*3+(S.ch2?S.ch2.solved.length*50+S.ch2.peace*20:0)+({hero:40,bua:40,dark:40,master:150,legend:300}[e]||0)+(S.act3?(S.act3Cases||[]).filter(x=>S.ch2.solved.includes(x)).length*60:0)))}
function endGame(e){if(!['hero','bua','dark','master','legend'].includes(e))sfx('die');else sfx('win');
 S.ending=e;S.screen='end';
 M.lineage=M.lineage||[];M.lineage.unshift({cls:S.cls,e,day:S.day,trait:S.trait,karma:S.karma||0});M.lineage=M.lineage.slice(0,12);
 if(!['hero','bua','dark','master','legend'].includes(e)){const rl=S.relics.filter(r=>!RELICS[r].secret&&!M.shattered.includes(r));M.corpse=rl.length?{relics:sh(rl).slice(0,2),day:S.day,cls:S.cls}:null}
 const m=meritOf(e);S.r.merit=m;gain(m);
 if(S.day>M.st.maxDay)M.st.maxDay=S.day;
 if(!M.st.endings.includes(e))M.st.endings.push(e);
 if(['hero','bua','dark','master','legend'].includes(e))M.st.wins++;
 if(e==='dark'&&!M.classes.includes('sorcer'))M.classes.push('sorcer');
 saveM();store.del('save');checkAch();render();
}

}

 {id:'yod',when:()=>!S.allies.yod&&!S.flags.yodGone&&S.day>3,run:()=>({t:'เสือยอด',s:'นักเลงหัวไม้สักยันต์เต็มหลัง นั่งยองๆ สูบยาเส้นอยู่ริมทาง "ได้ข่าวว่ามึงจะไปเอาเมียหมอผีคืนเหรอ กูก็แค้นมันเหมือนกัน มันฆ่าน้องกู ข้าวสาร 3 ถุงแล้วกูไปด้วย"',o:[[`ให้ข้าว 3 ถุง (มี ${inv('rice')})`,()=>{if(inv('rice')>=3){add('rice',-3);S.allies.yod=1;L('เสือยอดเข้าร่วม! ช่วยฟาดทุกเทิร์น แต่กินข้าวทุก 2 วัน','gold')}else L('ข้าวไม่พอ เสือยอดถุยน้ำลายแล้วเดินไป','bad')}],['ไม่ล่ะ',()=>{S.flags.yodGone=1;L('"ตามใจมึง ตายก่อนกูก็แล้วกัน"')}]]})},
 {id:'monk',when:()=>!S.allies.monk&&(S.visits.temple||0)>0,run:()=>({t:'หลวงตาเปลี่ยน',s:'พระแก่รูปเดียวที่ยังอยู่ในวัดร้าง จีวรขาดวิ่น "โยม... ถ้าเอาเทียนมาให้อาตมา 3 เล่ม อาตมาจะลงผ้ายันต์ครูให้ และจะสวดให้โยมทุกคืน"',o:[[`ถวายเทียน 3 (มี ${inv('candle')})`,()=>{if(inv('candle')>=3){add('candle',-3);S.allies.monk=1;gotRelic('yan','หลวงตาสวดให้ทุกคืน (คำสาป −3/คืน)')}else L('เทียนไม่พอ หลวงตายิ้มเศร้าๆ','bad')}],['ไว้ทีหลัง',()=>{}]]})},
 {id:'bua2',w:3,when:()=>S.flags.metBua&&!S.buaHostile&&S.aff>=1&&S.aff<5,run:()=>({t:'แขกยามวิกาล',s:'กลิ่นดอกบัวลอยเข้ามาในกระต๊อบ บัวลอยนั่งอยู่ปลายเสื่อ ผ้าซิ่นเปียกแนบลำตัว ผมยาวสยายหยดน้ำ นางโน้มตัวเข้ามาจนลมหายใจเย็นเฉียบรดต้นคอมึง "คืนนี้ข้าเหงา... ให้ข้าอยู่ด้วยนะ" ผู้หญิงที่ตายไปแล้วไม่ควรสวยขนาดนี้',o:[['ยอมให้นางอยู่',()=>{S.aff++;M.st.buaNight++;qInc('buaNight');stat('hp',14);stat('san',12);stat('curse',curseGain(9));L('นางดับตะเกียงด้วยนิ้วเปียกๆ... (ตัดฉาก) เช้ามามึงตื่นมาพร้อมกลิ่นดอกบัวติดตัว ร่างกายสดชื่นแปลกๆ แต่คำสาปเพิ่มขึ้น ความรักบัวลอย +1','pink')}],['ขอแค่คุยกัน',()=>{stat('san',5);if(ch(.5))S.aff++;L('นางหัวเราะคิกแล้วนอนหนุนตักมึงเล่าเรื่องตอนยังมีชีวิต ก่อนไก่ขันก็หายไป','pink')}],['สวดไล่',()=>{S.aff=Math.max(0,S.aff-2);if(S.aff===0)S.buaHostile=1;L('นางกรีดร้องแล้วหายไปในอากาศ ความรักบัวลอยลดลง','bad')}]]})},
 {id:'bua3',w:3,when:()=>S.aff>=4&&!S.allies.bua&&!S.buaHostile,run:()=>({t:'คำสาบานใต้น้ำ',s:`บัวลอยพามึงไปกลางบึง น้ำสูงแค่เอว นางคล้องแขนรอบคอมึงแนบชิด "หมอผีพวกนี้คือคนที่ฆ่าข้าแล้วกดวิญญาณข้าไว้ใต้บึง ข้าจะช่วยเจ้า แต่อย่าลืมข้านะ ต่อให้ได้${victim()}คืนก็เถอะ" นางควักดวงตาข้างหนึ่งของตัวเองออกมาวางบนฝ่ามือมึง`,o:[['สาบานว่าจะไม่ลืม',()=>{S.aff=5;S.allies.bua=1;gotRelic('eye','บัวลอยเข้าร่วม (ช่วยข่วน สติ +4/คืน ผีบุกน้อยลง)')}],['ข้ามีคนที่ต้องช่วยอยู่แล้ว',()=>{S.aff=3;L('นางนิ่งไปนาน "งั้นไปซะ ก่อนข้าจะเปลี่ยนใจ"','pink')}]]})},
 {id:'bua4',w:2,when:()=>S.allies.bua,run:()=>({t:'บัวลอยหึง',s:`บัวลอยนั่งหวีผมอยู่ริมหน้าต่าง ไม่ยอมหันมามอง "เมื่อคืนเจ้าละเมอเรียกชื่อ${victim()}" นางพูดเสียงเย็น "ข้าอยู่ตรงนี้แท้ๆ"`,o:[['ดึงนางมากอดจากข้างหลัง',()=>{M.st.buaNight++;qInc('buaNight');stat('san',10);stat('curse',curseGain(6));L('นางเอนหัวพิงอกมึงแล้วหัวเราะเบาๆ คืนนั้นทั้งคืนตะเกียงไม่ได้จุดเลย (ตัดฉาก)','pink')}],['บอกตรงๆ ว่ามาเพื่อช่วยเธอ',()=>{stat('san',-5);if(ch(.3)){S.allies.bua=0;S.aff=2;L('บัวลอยหายไปพร้อมน้ำตา นางทิ้งมึงไปแล้ว','bad')}else L('นางเงียบไปนาน แต่ก็ยังอยู่','pink')}]]})},
 {id:'deal',when:()=>S.day>12&&!S.flags.deal,run:()=>({t:'ร่างทรงมาเจรจา',s:`ชายตาขาวโพลนยืนอยู่หน้ากระต๊อบ พูดด้วยเสียงของ${boss().n} "เลิกยุ่งกับงานแต่งของข้าซะ แล้วข้าจะถอนคำสาปบนตัวเอ็งให้หมด"`,o:[['รับข้อเสนอ',()=>{S.flags.deal=1;M.st.deal=1;S.curse=0;karma(-4,'ขายวิญญาณ');stat('power',15);stat('san',-10);L('คำสาปหายเป็นปลิดทิ้ง แต่มึงรู้สึกเหมือนขายวิญญาณ พลังหมอผี +15','bad')}],['ถุยน้ำลายใส่หน้า',()=>{S.flags.deal=1;stat('san',8);stat('curse',curseGain(6));L('"ก็ได้... รอดูคืนที่ 49 ละกัน" ร่างทรงล้มลงชักตาย','good')}]]})},
 {id:'bless',when:()=>S.weapon===2&&inv('holy')>=1,run:()=>({t:'แสงในโบสถ์',s:'ฟ้าแลบเข้ามาในโบสถ์ร้าง พระพุทธรูปที่หักครึ่งองค์เปล่งแสงเรืองๆ ดาบในมือมึงสั่นเหมือนมีชีวิต',o:[['เอาดาบไปจุ่มน้ำมนต์ต่อหน้าพระ',()=>{add('holy',-1);S.weapon=3;L('ดาบกลายเป็นดาบลงอาคม! ฟันผีได้เต็มแรง','gold')}],['ไม่ใช่เวลา',()=>{}]]})},
 {id:'kid',when:()=>S.day>3,run:()=>({t:'เด็กหลงทาง',s:'เด็กผู้ชายตัวเล็กยืนร้องไห้อยู่หน้ากระต๊อบตอนหัวค่ำ เท้าเปล่าเปื้อนโคลน "หาแม่ไม่เจอ..."',o:[['พาไปส่งบ้าน',()=>{if(ch(.55)){stat('san',10);add('rice',2);L('แม่ของเด็กร้องไห้ขอบคุณ ให้ข้าวมา 2 ถุง','good')}else{L('เด็กหันมายิ้มกว้างถึงใบหู... มันคือกุมารทอง!','bad');return 'fight:kuman'}}],['ไล่ไป',()=>{stat('san',-3);L('เสียงร้องไห้ค่อยๆ เปลี่ยนเป็นเสียงหัวเราะคิกคักไกลออกไป')}]]})},
 {id:'well',when:()=>true,run:()=>({t:'บ่อน้ำในป่า',s:'เจอบ่อน้ำเก่าก่อด้วยอิฐมอญ น้ำใสจนเห็นก้นบ่อ ก้นบ่อมีเหรียญโบราณกับเส้นผมยาวๆ กองอยู่',o:[['ตักน้ำกิน',()=>{if(ch(.5)){stat('hp',20);stat('wat',40);L('น้ำเย็นชื่นใจ แผลหายไปบางส่วน','good')}else{stat('wat',40);stat('curse',curseGain(10));L('ดื่มเสร็จได้ยินเสียงผู้หญิงหัวเราะจากก้นบ่อ...','bad')}}],['โยนเกลือลงไปก่อน',()=>{if(inv('salt')){add('salt',-1);add('water',3);L('น้ำเดือดปุดๆ แล้วใสสะอาด ได้น้ำ 3','good')}else L('ไม่มีเกลือ เลยเดินผ่านไป')}],['ไม่ยุ่ง',()=>{}]]})},
 {id:'gamble',when:()=>inv('rice')>=2,run:()=>({t:'วงไพ่ผีพนัน',s:'ในศาลาร้างมีชายสามคนนั่งล้อมวงเล่นไพ่ใต้ตะเกียง ทุกคนไม่มีเงาเลยสักคน "มาลงสักตาไหม ข้าวสาร 2 ถุง ชนะได้ห้าเท่า"',o:[['ลงข้าว 2 ถุง',()=>{add('rice',-2);if(has('pod')||ch(.42)){add('rice',4);add('holy',2);add('band',2);add('salt',2);L('ชนะ! ได้ข้าว 4 น้ำมนต์ 2 ผ้าพันแผล 2 เกลือ 2','gold')}else{stat('san',-5);L('แพ้หมดตัว พวกมันหัวเราะจนหัวหลุดกลิ้งตกจากบ่า','bad')}}],['เดินหนี',()=>L('เดินออกมาโดยไม่หันหลัง')]]})},
 {id:'funeral',when:()=>inv('candle')>0,run:()=>({t:'ศพไร้ญาติ',s:'ศพชายแก่วางอยู่บนแคร่หน้าบ้านร้าง ไม่มีใครจุดธูปให้ แมลงวันตอมเต็มหน้า',o:[['จุดเทียนสวดให้',()=>{add('candle',-1);stat('san',12);stat('curse',-6);stat('power',-3);karma(1,'สวดให้ศพ');L('วิญญาณชายแก่ยกมือไหว้แล้วจากไปอย่างสงบ พลังหมอผี −3','good')}],['ค้นตัวศพ',()=>{add('salt',2);karma(-1,'ค้นศพ');stat('curse',curseGain(8));L('เจอเกลือเสก 2 ถุงในย่าม แต่มีมือเย็นๆ แตะไหล่ตอนเดินกลับ','bad')}]]})},
 {id:'storm',when:()=>S.day>6,run:()=>({t:'พายุผี',s:'ลมพายุหมุนวนรอบกระต๊อบ หลังคาจากปลิว ในลมมีเสียงคนกรีดร้องหลายสิบเสียง',o:[['กอดย่ามไว้แน่น',()=>{stat('sta',-15);stat('san',-4);L('ของไม่หาย แต่ไม่ได้นอนทั้งคืน','bad')}],['หนีไปหลบที่วัด',()=>{if(ch(.5)){stat('san',6);L('หลวงตาให้ที่หลบ ปลอดภัย','good')}else{add(pick(['rice','water','herb']),-2);L('ทิ้งของไว้ พอกลับมาของหายไปบางส่วน','bad')}}]]})},
 {id:'dao',w:2,when:()=>S.day>8&&S.relics.length<3,run:()=>({t:'กระดาษในขวด',s:`ขวดแก้วลอยมาตามลำธาร ข้างในมีกระดาษเขียนด้วยเลือด ลายมือ${victim()} "${pick(['สายสิญจน์อยู่ใต้ฐานพระวัดร้าง ต้องไปหลายรอบ','ตะกรุดอยู่ในโลงที่ป่าช้า','หลวงตาที่วัดยังไม่ตาย ไปหาท่าน','ขัดพิธีสองครั้ง มันจะทิ้งมีดหมอไว้'])}"`,o:[['เก็บไว้เป็นกำลังใจ',()=>{stat('san',8);L('ใจเต้นแรงขึ้น เธอยังมีชีวิตอยู่','good')}]]})},
 {id:'yodA1',w:4,when:()=>S.allies.yod&&S.day>6&&!S.flags.yodA,run:()=>({t:'น้องชายเสือยอด',s:'คืนนั้นเสือยอดเมาเหล้าขาวแล้วร้องไห้เหมือนเด็ก "ไอ้ต้อมน้องกู มันไม่ได้ตาย หมอผีลากศพมันไปป่าช้า กูได้ยินเสียงมันเรียกทุกคืน..."',o:[['สัญญาว่าจะช่วยตามหา',()=>{S.flags.yodA=1;stat('san',3);L('เสือยอดกอดคอมึงแน่น "มึงคือพี่น้องกูแล้ว"','gold')}],['บอกว่าลืมมันไปเถอะ',()=>{S.flags.yodA=-1;L('เสือยอดเงียบไปทั้งคืน','bad')}]]})},
 {id:'yodA2',w:5,when:()=>S.allies.yod&&S.flags.yodA===1&&(S.visits.grave||0)>=1,run:()=>({t:'ไอ้ต้อม',s:'ท้ายป่าช้า ผีดิบตัวผอมแห้งยืนนิ่งอยู่ใต้ต้นมะขาม มันสวมสร้อยพระแบบเดียวกับเสือยอด มันหันมาแล้วพูดเสียงแหบ "พี่... กูหิว..." เสือยอดกำขวานจนมือสั่น',o:[['ช่วยเสือยอดปลดปล่อยน้อง',()=>{stat('hp',-15);S.flags.yodA=2;S.flags.yodStrong=1;arcDone('yod');gotRelic('beads','เสือยอดฟันคอน้องตัวเองด้วยน้ำตา ก่อนวิญญาณจะไป ไอ้ต้อมยื่นลูกประคำให้');L('เสือยอดตีแรงขึ้นถาวร +5 "ต่อจากนี้กูสู้เพื่อมันด้วย"','gold')}],['ให้เสือยอดตัดสินใจเอง',()=>{S.flags.yodA=2;if(ch(.5)){S.allies.yod=0;L('เสือยอดเดินเข้าไปกอดน้อง... แล้วไม่กลับมาอีกเลย','bad')}else{S.flags.yodStrong=1;arcDone('yod');L('เสือยอดปลดปล่อยน้องเอง แล้วเดินกลับมาเงียบๆ ตีแรงขึ้นถาวร +5','gold')}}]]})},

const SPECIAL_EV={
 grandwin:()=>({t:'พระครูไสยดำสิ้นแล้ว',s:'โซ่ที่ล่ามวิญญาณนับร้อยขาดสะบั้น ดวงวิญญาณลอยขึ้นฟ้าเหมือนหิ่งห้อย แต่บนร่างของพระครู มึงพบตราประทับรูปจันทร์เสี้ยวสีเงิน กับจดหมายที่เขียนว่า "ถึงศิษย์ผู้ภักดี สำนักเงาจันทร์รอเลือดของผู้ปราบผีอยู่"... ศึกครั้งนี้อาจไม่ใช่ครั้งสุดท้าย',o:[['ตามล่าสำนักเงาจันทร์ (ภาค 3) 🌘',()=>{startAct3();return 'stop'}],['พอแล้ว จบตำนานที่นี่',()=>endGame('master')]]}),
 yama:()=>{const o=[];
  if(S.relics.filter(r=>r!==S.flags.yamaUsed).length)o.push(['แลกของขลังหนึ่งชิ้น (สุ่ม)',()=>{const pool=S.relics.filter(r=>r!==S.flags.yamaUsed);const r=pick(pool);S.relics=S.relics.filter(x=>x!==r);yamaBack(`ยมบาลหยิบ${RELICS[r].n}ไปพลิกดูแล้วยิ้ม "พอใช้ได้"`)}]);
  if((S.boons||[]).length)o.push([`แลกพรทั้งหมด (${S.boons.length} ข้อ)`,()=>{S.boons=[];yamaBack('แสงพรทั้งหมดถูกดูดออกจากตัวมึงเข้าไปในสมุดดำของยมบาล')}]);
  if(S.aff>0||S.allies.bua)o.push(['แลกความทรงจำเรื่องบัวลอย',()=>{S.aff=0;S.allies.bua=0;S.flags.metBua=1;S.buaHostile=1;yamaBack('มึงจำไม่ได้แล้วว่าเคยรู้จักผู้หญิงที่บึง... มีแค่กลิ่นดอกบัวที่ทำให้น้ำตาไหลโดยไม่รู้สาเหตุ')}]);
  if(S.maxhp>60)o.push(['แลกอายุขัย (ชีวิตสูงสุด −30)',()=>{S.maxhp-=30;yamaBack('ยมบาลขีดเส้นในบัญชีชีวิตของมึงให้สั้นลง ผมของมึงหงอกขาวทันทีครึ่งหัว')}]);
  o.push(['ไม่ต่อรอง ยอมตาย',()=>endGame('dead')]);
  return {t:'ประตูยมโลก',s:`ความมืดกลืนทุกอย่าง แล้วมึงก็ยืนอยู่หน้าบัลลังก์หินสีดำ ยมบาลหน้าเขียวเปิดสมุดบัญชีคนตาย "ชื่อเอ็งยังไม่ถึงคิว ${RELICS[S.flags.yamaUsed].n}ในย่ามเอ็งพาเอ็งมาถึงนี่ได้... แต่ทุกอย่างมีราคา เอ็งจะจ่ายด้วยอะไร"`,o}},
 bua1:()=>({t:'หญิงสาวที่บึงบัว',s:'ใต้แสงจันทร์ หญิงสาวผมยาวนั่งอาบน้ำอยู่ริมบึง เนื้อตัวขาวซีดเหมือนกลีบบัว ผ้าซิ่นผืนเดียวแนบลำตัวเปียกโชก นางเหลียวมามองแล้วยิ้มมุมปาก "หลงทางมาหรือตั้งใจมาดูข้าล่ะพ่อหนุ่ม" ... เท้าของนางไม่แตะพื้นน้ำ',o:[['เข้าไปทักทาย',()=>{S.aff=1;stat('san',-3);L('นางชื่อบัวลอย นางจับมือมึงด้วยมือที่เย็นเหมือนน้ำแข็ง "แล้วเจอกันนะ" ความรักบัวลอย +1','pink')}],['สาดเกลือใส่',()=>{S.buaHostile=1;L('นางกรีดร้องเป็นเสียงผี "เจ้าจะต้องเสียใจ!" นางพรายที่บึงจะออกมาล่ามึง','bad')}],['ถอยหนีเงียบๆ',()=>L('มึงค่อยๆ ถอยออกมา ได้ยินเสียงหัวเราะเบาๆ ตามหลัง')]]}),
 final:()=>{const v=victim(),o=[['ออกเดินทางเป็นหมอผีพเนจร (ภาค 2) 🧭',()=>{startAct2();return 'stop'}],[`อุ้ม${v}กลับบ้าน (จบเกม)`,()=>endGame('hero')]];
  if(S.allies.bua)o.push([`ส่ง${v}กลับ แล้วกลับไปหาบัวลอยที่บึง`,()=>endGame('bua')]);
  o.push(['เลียเลือดหมอผี ยึดพลังมันมาเป็นของตัวเอง',()=>endGame('dark')]);
  return {t:`${boss().n} ตายแล้ว`,s:`หมอผีล้มลงขาดใจ ร่างมันเหี่ยวแห้งเป็นฝุ่นต่อหน้าต่อตา เชือกที่มัด${v}ขาดเอง เธอวิ่งมาซบอกมึงทั้งน้ำตา ชุดเจ้าสาวขาดวิ่น แต่ข่าวเรื่องคนที่ปราบหมอผีเขาดำได้เริ่มแพร่ไปทั่ว มีคนเดินทางมาขอให้ช่วยจากหลายหมู่บ้าน... ส่วนเลือดดำที่นองพื้นถ้ำ ยังส่งเสียงกระซิบเรียกมึงอยู่`,o}}
};
function yamaBack(t){S.hp=Math.round(S.maxhp*.5);M.st.yama=1;saveM();L(t,'gold');L('มึงสะดุ้งตื่นกลางดินเย็นเฉียบ ยังหายใจอยู่ ('+RELICS[S.flags.yamaUsed].n+' หมดฤทธิ์ในรอบนี้)','gold')}
function arcDone(id){M.st.arcs=M.st.arcs||[];if(!M.st.arcs.includes(id))M.st.arcs.push(id);saveM()}
function getEvent(){const id=S.event.id;return SPECIAL_EV[id]?SPECIAL_EV[id]():EVENTS.find(e=>e.id===id).run()}
let curEv=null;
function chooseEv(i){
 const fn=curEv.o[i][1];S.event=null;S.screen='plan';
 const r=fn();
 if(S.screen==='end'||r==='stop')return;
 if(typeof r==='string'&&r.startsWith('fight:')){startCombat(r.slice(6),{after:'none'});save();render();return}
 advance();
}

const CRAFT=[
 {n:'ขวดดินเผาขังผี',d:'เทียน 1 + น้ำมนต์ 1 + ผ้าขาว 1 · ใช้จับผีที่เลือดต่ำ',ok:()=>inv('candle')&&inv('holy')&&inv('cloth'),do:()=>{add('candle',-1);add('holy',-1);add('cloth',-1);add('jar',1)}},
 {n:'น้ำมนต์',d:'น้ำ 1 + เทียน 1',ok:()=>inv('water')&&inv('candle'),do:()=>{add('water',-1);add('candle',-1);add('holy',1)}},

 {n:'เสกเกลือ ×2',d:'ข้าวสาร 1 + เทียน 1',ok:()=>inv('rice')&&inv('candle'),do:()=>{add('rice',-1);add('candle',-1);add('salt',2)}},
 {n:'ผ้าพันแผล ×2',d:'ผ้าขาว 1 + สมุนไพร 1',ok:()=>inv('cloth')&&inv('herb'),do:()=>{add('cloth',-1);add('herb',-1);add('band',2)}},
 {n:'ลงผ้ายันต์ +1',d:'ผ้าขาว 1 + เทียน 2 + น้ำมนต์ 1 (เกราะสูงสุด 3)',ok:()=>S.armor<3&&inv('cloth')&&inv('candle')>=2&&inv('holy'),do:()=>{add('cloth',-1);add('candle',-2);add('holy',-1);S.armor++}},
 {n:'ลงอาคมดาบ',d:'ดาบเหล็กน้ำพี้ + น้ำมนต์ 2 + เทียน 2',ok:()=>S.weapon===2&&inv('holy')>=2&&inv('candle')>=2,do:()=>{add('holy',-2);add('candle',-2);S.weapon=3}}
];
let craftMsg='';
function doCraft(i){const c=CRAFT[i];if(!c.ok())return;c.do();M.st.crafts++;qInc('craft');craftMsg='ทำ'+c.n+'แล้ว';save();checkAch();render();const d=document.querySelector('details');if(d)d.open=true}

/* ---------- RENDER ---------- */
function isLow(k){const v=S[k];return k==='hp'?v<S.maxhp*.3:k==='curse'?v>=75:v<=25}
function warnH(){const w=[];if(isLow('hp'))w.push('❤️ เลือดน้อย');if(isLow('food'))w.push('🍚 หิว');if(isLow('wat'))w.push('💧 กระหาย');if(isLow('san'))w.push('🧠 สติจะแตก');if(isLow('curse'))w.push('🟣 คำสาปใกล้เต็ม');if(isLow('sta'))w.push('💪 หมดแรง');if(S.power>=80&&!S.ch2)w.push('🧿 พิธีใกล้เสร็จ');return w.length?`<div class="warns">${w.map(x=>`<span class="warn">${x}</span>`).join('')}</div>`:''}
function barH(k,col){const v=S[k],mx=k==='hp'?S.maxhp:100;return `<div class="bar${isLow(k)?' low':''}"><div class="lab"><span>${k==='san'&&S.mode==='mad'?'ความจริง':STATN[k]}</span><b>${v}${k==='hp'?'/'+mx:''}</b></div><div class="track"><div class="fill" style="width:${v/mx*100}%;background:${col}"></div></div></div>`}
function statsH(){
 return `<div class="card"><div class="top"><div><div class="day">คืนที่ ${Math.min(S.day,49)} / 49${S.cycle?` <span style="font-size:14px">· ♾️ รอบ ${S.cycle+1}</span>`:''}</div><span class="muted">เหลือ ${Math.max(0,49-S.day)} คืนก่อนวิวาห์ผี · ${CLASSES[S.cls].i} ${CLASSES[S.cls].n}</span></div><div class="muted" style="text-align:right">${WEAPONS[S.weapon].n}<br>ผ้ายันต์ ${S.armor}/3</div></div>
 <div class="bars">${barH('hp','var(--red)')}${barH('sta','var(--gold)')}${barH('food','#c98a3c')}${barH('wat','var(--blue)')}${barH('san','var(--green)')}${barH('curse','var(--purple)')}</div>

   ['rest','🛏️ พักฟื้นทั้งวัน','แรง +35 ชีวิต +10'],
   ...(canCave?[['cave','☠️ บุกถ้ำเขาดำ (สู้บอส)',`ของขลังหลัก ${coreN} · รวม ${S.relics.length} ชิ้น · ไม่มีทางถอย`]]:[])];
  if(final)S.act='cave';
  if(S.act==='cave'&&!canCave)S.act='search';
  const NT={sleep:['😴','นอน','แรง +30 ชีวิต +6 · ถ้าผีบุกจะโดนตีก่อน'],guard:['👁️','เฝ้ายาม','แรง +10 · ผีบุกน้อยลงและไม่โดนซุ่ม'],pray:['🕯️','สวดมนต์',`ใช้เทียน 1 (มี ${inv('candle')}) · คำสาป −8 สติ +9 แรง +15`]};
  const actLbl=S.act==='search'?LOC[S.loc].i+' '+LOC[S.loc].n:S.act==='disrupt'?'🔥 ขัดพิธีที่ศาล':S.act==='rest'?'🛏️ พักทั้งวัน':'☠️ บุกถ้ำเขาดำ';
  const mini=(v,mx,c)=>`<div class="mtrack"><i style="width:${v/mx*100}%;background:${c}"></i></div>`;
  h=`<div class="sticky"><div class="sb-row"><button class="icon" aria-label="หน้าแรก" onclick="S=null;view='home';render()">🏠</button><button class="icon" aria-label="เสียง" onclick="toggleSnd()">${SND.on?'🔊':'🔇'}</button>
   <div class="sb-info"><b>${MOON[moon()][0].split(' ')[0]} คืนที่ ${Math.min(S.day,49)}/49${S.cycle?' · ♾️'+(S.cycle+1):''}</b><span>${actLbl}${S.act!=='cave'?' · '+NT[S.night][0]+' '+NT[S.night][1]:''}</span></div>
   <button class="btn pri go" onclick="startDay()">${S.act==='cave'?'เข้าถ้ำ ☠️':'เริ่มวัน ▶'}</button></div>
   <div class="minis"><span>❤️</span>${mini(S.hp,S.maxhp,'var(--red)')}<span>🟣</span>${mini(S.curse,100,'var(--purple)')}<span>🧿</span>${mini(S.power,100,'#e0303a')}</div>${warnH()}</div>`
  +statsH()+healH()+`<div class="card"><h3>☀️ กลางวันทำอะไร</h3><div class="grid2">${acts.map(([k,t,d])=>`<button class="btn tile ${k==='cave'?'span2':''}" aria-pressed="${S.act===k}" onclick="S.act='${k}';render()">${t}<small>${d}</small></button>`).join('')}</div>
  ${S.act==='search'?`<h3>📍 ไปที่ไหน</h3><div class="grid2">${SEARCH_LOCS.map(k=>`<button class="btn tile loc" aria-pressed="${S.loc===k}" onclick="S.loc='${k}';render()"><span class="li">${LOC[k].i}</span>${LOC[k].n}<small>${LOC[k].d}</small></button>`).join('')}</div>`:''}
  </div>
  ${S.act!=='cave'?`<div class="card"><h3>🌙 คืนนี้</h3><div class="seg">${Object.entries(NT).map(([k,[i,t]])=>`<button class="btn" aria-pressed="${S.night===k}" ${k==='pray'&&!inv('candle')?'disabled':''} onclick="S.night='${k}';render()">${i} ${t}</button>`).join('')}</div><p class="muted" style="font-size:13px">${NT[S.night][2]}</p></div>`:''}
  <details class="card" ${craftMsg?'open':''}><summary>🧪 ทำของ / ลงอาคม ${CRAFT.filter(c=>c.ok()).length?`<span class="badge">${CRAFT.filter(c=>c.ok()).length}</span>`:''}</summary>${CRAFT.map((c,i)=>`<button class="btn" ${c.ok()?'':'disabled'} onclick="doCraft(${i})">${c.n}<small>${c.d}</small></button>`).join('')}${craftMsg?`<p style="color:#bfe3bb">${craftMsg}</p>`:''}</details>
  ${invH()}${extraH()}`;
 }
 else if(sc==='combat'){
  const C=S.combat,b=EN[C.id];
  const nm=enemyName();
  h=`<div class="enemy" style="position:relative"><button class="icon" style="position:absolute;right:8px;top:8px;width:36px;height:36px;font-size:15px" onclick="toggleSnd()">${SND.on?'🔊':'🔇'}</button>${ART[artKey(C)]?`<div class="art">${ART[artKey(C)]}</div>`:`<div class="ico">${b.i}</div>`}<h2>${nm}${skOf(C)&&SK[skOf(C)]?` <span title="มีวิชา">🌀${SK[skOf(C)].i}</span>`:''}</h2>${C.br&&C.br.length?`<div class="chips" style="justify-content:center;margin-top:6px">${C.br.map(k=>`<span class="chip" style="border-color:var(--red);color:#f1b7b7">${BREL[k].i} ${BREL[k].n}<br><small>${BREL[k].d}</small></span>`).join('')}</div>`:''}<div class="bar" style="margin-top:8px"><div class="lab"><span>${b.g===1?'ผี':b.g===0?'คน':'ครึ่งคนครึ่งผี'}</span><b>${Math.max(0,C.hp)} / ${C.max}</b></div><div class="track"><div class="fill" style="width:${Math.max(0,C.hp/C.max*100)}%;background:var(--red)"></div></div></div></div>
  ${C.adds&&C.adds.length?`<div class="card" style="border-color:var(--red2)"><h3 style="color:#f3a3a3">ตัวที่มาร่วมวง ${C.adds.length}</h3>${C.adds.map(ad=>`<div class="bar"><div class="lab"><span>${EN[ad.id].i} ${EN[ad.id].n}</span><b>${Math.max(0,ad.hp)}/${ad.max}</b></div><div class="track"><div class="fill" style="width:${Math.max(0,ad.hp/ad.max*100)}%;background:#a33"></div></div></div>`).join('')}</div>`:''}
  <div class="card log">${C.log.map(([t,c])=>`<p class="${c}">${t}</p>`).join('')}</div>
  <div class="cstats"><span class="${isLow('hp')?'low':''}">❤️ ${S.hp}/${S.maxhp}</span><span class="${isLow('san')?'low':''}">🧠 ${S.san}</span><span class="${isLow('curse')?'low':''}">🟣 ${S.curse}</span><span class="${isLow('sta')?'low':''}">💪 ${S.sta}</span></div>
  <div class="grid2">
   ${C.adds&&C.adds.length?`<button class="btn" onclick="cAct('hitAdd')">🪓 ฟันตัวที่รุม<small>${EN[C.adds[0].id].n}</small></button>`:''}
   <button class="btn" onclick="cAct('hit')">⚔️ ฟัน<small>${WEAPONS[S.weapon].n}${C.last==='holy'&&S.spells.includes('purify')?' · ดาบชำระพร้อม!':''}</small></button>
   ${(S.skills||[]).map((k,i)=>`<button class="btn" style="border-color:var(--purple)" onclick="cAct('sk${i}')">${SK[k.id].i} ${SK[k.id].n} ข${skLv(k)}${k.bad?' ⚠️':''}<small>${SK[k.id].d(skLv(k))}</small></button>`).join('')}${skOf(C)&&SK[skOf(C)]?`<button class="btn" style="border-color:var(--gold)" onclick="cAct('absorb')">🌀 ดูดวิชา<small>${SK[skOf(C)].i} ${SK[skOf(C)].n} · ${C.hp<=C.max*.3?'พร้อมดูด!':'ต้องเลือด ≤30%'}</small></button>`:''}${(S.karma||0)>=6?`<button class="btn" onclick="cAct('buddha')">☸️ แสงบุญ<small>ตีผีแรง + ฟื้นชีวิต</small></button>`:''}${(S.karma||0)<=-6?`<button class="btn" onclick="cAct('blackk')">🩸 เงาบาป<small>26–38 · คำสาป สติ</small></button>`:''}
   <button class="btn" ${inv('salt')?'':'disabled'} onclick="cAct('salt')">🧂 เกลือเสก ${inv('salt')}<small>ผีชะงัก 1 ตา</small></button>
   <button class="btn" ${inv('holy')?'':'disabled'} onclick="cAct('holy')">💧 น้ำมนต์ ${inv('holy')}<small>แรงมากกับผี</small></button>
   <button class="btn" ${S.san>10?'':'disabled'} onclick="cAct('chant')">📿 คาถา<small>สติ −${S.cls==='mordham'?6:10} · คำสาป −5</small></button>
   ${S.cls==='sorcer'?`<button class="btn" onclick="cAct('black')">🩸 ไสยดำ<small>24–36 ทุกศัตรู · คำสาปขึ้น</small></button>`:''}
   ${inv('jar')?`<button class="btn" onclick="cAct('jar')">🏺 ขังผี ${inv('jar')}<small>${b.g===1&&!(C.boss||C.id==='queen'||C.id.startsWith('cb_')||C.id==='grand')&&C.hp<=C.max*.35?'พร้อมขัง!':'ต้องเลือดต่ำ ≤35%'}</small></button>`:''}
   <button class="btn" ${inv('band')?'':'disabled'} onclick="cAct('band')">🩹 ผ้าพันแผล ${inv('band')}<small>+22 ชีวิต</small></button>
   <button class="btn" ${inv('med')||inv('herb')?'':'disabled'} onclick="cAct(inv('med')?'med':'herb')">🌿 ${inv('med')?'ยาผีบอก '+inv('med'):'สมุนไพร '+inv('herb')}<small>${inv('med')?'+30 ชีวิต −10 คำสาป':'+10 ชีวิต −4 คำสาป'}</small></button>
  </div>
  ${C.boss||C.id==='queen'||C.big||C.id==='grand'||C.id==='moon'?'':`<button class="btn c" onclick="cAct('flee')">🏃 หนี (ทิ้งของ)</button>`}`;
 }
 else if(sc==='boon'){
  h=`<div class="card story" style="text-align:center"><div style="font-size:44px">🌑</div><h2>คืนเดือนดับ</h2><p>ครบเจ็ดคืนอีกครั้ง ลมเย็นพัดผ่านกระต๊อบ เทวดาประจำหมู่บ้านกระซิบข้างหู "เลือกพรได้หนึ่งข้อ"</p></div>${(S.boonChoice||[]).map(k=>`<button class="btn tile" onclick="takeBoon('${k}')"><span class="li" style="font-size:28px;display:block">${BOONS[k].i}</span>${BOONS[k].n} ${{r:'<span class="badge" style="background:#3a6ea8">หายาก</span>',l:'<span class="badge" style="background:var(--gold);color:#1a1006">ตำนาน</span>'}[BOONS[k].t]||''}<small>${BOONS[k].d}</small></button>`).join('')}`;
 }
 else if(sc==='event'){
  curEv=getEvent();
  h=`<div class="card story"><h2>${curEv.t}</h2><p>${curEv.s}</p></div>${curEv.o.map((o,i)=>`<button class="btn" onclick="chooseEv(${i})">${o[0]}</button>`).join('')}`;
 }
 else if(sc==='report'){
  h=`<button class="btn pri" onclick="S.screen='plan';craftMsg='';save();render()">${S.ch2?'ต่อไป →':'ไปคืนที่ '+S.day+' →'}</button><div class="card"><h2>สรุปวัน</h2><div class="log">${S.log.map(([t,c])=>`<p class="${c}">${t}</p>`).join('')}</div></div>`+(S.ch2?statsH2():statsH())+`<button class="btn pri" onclick="S.screen='plan';craftMsg='';save();render()">${S.ch2?'ต่อไป →':'คืนที่ '+S.day+' →'}</button>`;
 }
 else if(sc==='end'){
  const E=ENDINGS[S.ending],good=['hero','bua','dark','master','legend'].includes(S.ending);
  h=`<div class="title-ico">${E.i}</div><h1 style="text-align:center;color:${good?'var(--gold)':'var(--red)'}">${E.t}</h1>
  <div class="card story"><p>${E.s()}</p>${good?`<p class="muted">${(S.karma||0)>=6?'☸️ ชาวบ้านสร้างศาลไว้บูชามึงในฐานะผู้มีบุญ':(S.karma||0)<=-6?'🩸 ชาวบ้านไม่กล้าสบตามึง ลือกันว่ามึงเลี้ยงผีไว้ใช้':'ชาวบ้านจดจำมึงในฐานะคนธรรมดาที่กล้าหาญ'}</p>`:''}</div>
  <div class="card"><p class="merit" style="font-size:20px">+${S.r.merit} บุญ 🪷</p><p>คืนที่ ${Math.min(S.day,49)}${S.cycle?' · รอบไม่รู้จบ '+(S.cycle+1):''} · ฆ่า ${S.r.kills} ตัว · ของขลัง ${S.relics.length}/5 · ขัดพิธี ${S.disrupts} ครั้ง</p>${S.log.length&&!good?`<div class="log">${S.log.slice(-4).map(([t,c])=>`<p class="${c}">${t}</p>`).join('')}</div>`:''}</div>
  ${(S.skills||[]).length&&!S.heirDone?`<div class="card"><h3>🧬 ส่งต่อวิชาให้ลูกหลาน</h3><p class="muted" style="font-size:13px">เลือกได้ 1 วิชา รุ่นต่อไปจะได้วิชานี้ขั้น 1 (มีโอกาส 30% ที่จะเลือนหาย)${S.ending==='dead'&&M.nemesis?' · ⚠️ ผีคู่แค้นจะขโมยวิชานี้ไป ต้องฆ่ามันเพื่อเอาคืน':''}</p>${S.skills.map((k,i)=>`<button class="btn" onclick="inherit(${i})">${SK[k.id].i} ${SK[k.id].n}</button>`).join('')}</div>`:''}<button class="btn pri" onclick="S=null;view='class';render()">เริ่มใหม่</button><button class="btn c" onclick="S=null;view='shop';render()">ไปทำบุญ (อัปเกรด)</button><button class="btn c" onclick="S=null;view='home';render()">หน้าแรก</button>`;
 }
 $app.innerHTML=h;
 const key=sc+(S?S.day+':'+(S.combat?1:0):view);if(key!==lastKey){window.scrollTo(0,0);lastKey=key}
}
function contGame(){S=store.get('save',null);if(!S){render();return}if(!S.r)S.r={kills:0,holy:0,merit:0};if(!S.maxhp)S.maxhp=100;if(!S.cls)S.cls='villager';if(S.cycle==null)S.cycle=0;if(S.mode==='endless')S.mode=null;if(!S.trait){S.trait='merchant';S.phobia='dark';S.karma=0;S.kp=0;S.spt=0;S.spells=[]}if(S.screen==='qte')S.screen='plan';if(!S.skills)S.skills=[];if(S.screen==='skswap'&&!S.pendSk)S.screen='plan';(S.genCases||[]).forEach(regGen);render()}
daily();render();
</script>
</body>
