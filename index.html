<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>คืนวิวาห์ผี v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0809;--panel:#16100f;--soft:#211816;--line:#3a2a26;--ink:#efe4d6;--muted:#a8968a;--red:#c0262f;--red2:#7d151b;--gold:#d8aa4f;--green:#5fa05a;--blue:#5a8ec0;--purple:#9a63c9;
--display:'Kanit',sans-serif;--body:'Sarabun',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at top,#2a0e10 0%,var(--bg) 60%) fixed}
.wrap{max-width:520px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 40px max(14px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.2}
h1{font-size:30px;color:var(--gold);text-shadow:0 0 18px rgba(192,38,47,.6)}
h2{font-size:20px}
h3{font-size:16px;color:var(--gold)}
p{margin:0}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.btn{font:600 15px/1.3 var(--body);border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:11px;padding:11px 14px;min-height:46px;cursor:pointer;text-align:left;width:100%}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.pri{background:var(--red);border-color:transparent;color:#fff;text-align:center;font-family:var(--display);font-size:17px}
.btn.c{text-align:center}
.btn[aria-pressed="true"]{border-color:var(--gold);background:#2d2014;box-shadow:inset 0 0 0 1px var(--gold)}
.btn small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.day{font-family:var(--display);font-size:24px;color:var(--gold)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.bar{display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.bar .lab{display:flex;justify-content:space-between;color:var(--muted)}
.bar .lab b{color:var(--ink);font-variant-numeric:tabular-nums}
.track{height:7px;background:#000;border-radius:4px;overflow:hidden}
.fill{height:100%;border-radius:4px;transition:width .3s}
.power .track{height:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:13px}
.chip.relic{border-color:var(--gold);color:var(--gold)}
.chip.ally{border-color:var(--purple);color:#d4b5ef}
.log{display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.log p{padding-left:10px;border-left:2px solid var(--line)}
.log p.bad{border-color:var(--red);color:#f1b7b7}
.log p.good{border-color:var(--green);color:#bfe3bb}
.log p.gold{border-color:var(--gold);color:#f0d9a6}
.log p.pink{border-color:var(--purple);color:#e3c9f5}
.enemy{text-align:center;padding:16px 10px;background:linear-gradient(#1e0b0c,#120a0a);border:1px solid var(--red2);border-radius:14px}

.enemy h2{color:#f3a3a3;margin-top:6px}
.story{font-size:16px;line-height:1.7}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg .btn{text-align:center;padding:9px 4px}
.foot{font-size:12px;color:var(--muted);text-align:center}
.title-ico{font-size:64px;text-align:center}
details summary{cursor:pointer;color:var(--gold);font-family:var(--display)}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.merit{font-family:var(--display);color:var(--gold)}
.ach{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.ach:last-child{border:0}
.ach .ai{font-size:22px;width:30px;text-align:center;flex:none}
.ach.lock{opacity:.4}
.ach b{display:block}
.ach span{font-size:13px;color:var(--muted)}
.prog{height:6px;background:#000;border-radius:3px;overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:var(--gold)}
#toast{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);z-index:9;display:flex;flex-direction:column;gap:6px;width:min(92vw,420px);pointer-events:none}
#toast div{background:#2d2014;border:1px solid var(--gold);color:var(--gold);border-radius:12px;padding:10px 14px;font-family:var(--display);box-shadow:0 6px 24px rgba(0,0,0,.6);animation:tin .3s}
#toast small{display:block;color:var(--ink);font-family:var(--body)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
.sticky{position:sticky;top:0;z-index:5;margin:0 -14px;padding:max(8px,env(safe-area-inset-top)) 14px 10px;background:rgba(12,8,9,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sb-row{display:flex;align-items:center;gap:10px}
.sb-info{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.sb-info b{font-family:var(--display);color:var(--gold);font-size:17px}
.sb-info span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:44px;height:44px;flex:none;border-radius:11px;border:1px solid var(--line);background:var(--soft);font-size:18px;cursor:pointer}
.btn.go{width:auto;flex:none;padding:10px 18px;box-shadow:0 0 18px rgba(192,38,47,.45)}
.minis{display:grid;grid-template-columns:auto 1fr auto 1fr auto 1fr;gap:6px;align-items:center;font-size:12px}
.mtrack{height:5px;background:#000;border-radius:3px;overflow:hidden}
.mtrack i{display:block;height:100%}
.btn.tile{padding:10px 11px;font-size:14px}
.btn.tile small{font-size:12px;margin-top:2px}
.span2{grid-column:1/-1}
.loc .li{display:block;font-size:24px;line-height:1.1;margin-bottom:2px}
.badge{background:var(--red);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-left:4px;font-family:var(--body)}
.wrap>.sticky:first-child{margin-top:calc(-1 * max(14px,env(safe-area-inset-top)))}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tabs .btn{text-align:center;padding:8px 2px;font-size:13px}
</style>
</head>

function daily(){
 const d=today();
 if(!M.daily||M.daily.date!==d){
  let h=0;for(const c of d)h=(h*31+c.charCodeAt(0))>>>0;
  const ids=[];while(ids.length<3){h=(h*1103515245+12345)>>>0;const q=QPOOL[h%QPOOL.length].id;if(!ids.includes(q))ids.push(q)}
  M.daily={date:d,ids,prog:{},done:[],bonus:0};saveM();
 }
 return M.daily;
}
function qInc(k,n){
 n=n||1;const D=daily();
 if(!D.ids.includes(k)||D.done.includes(k))return;
 D.prog[k]=(D.prog[k]||0)+n;
 const q=QPOOL.find(x=>x.id===k);
 if(D.prog[k]>=q.n){D.done.push(k);gain(15);toast('ภารกิจรายวันสำเร็จ!',q.t+' · +15 บุญ');
  if(D.done.length===3&&!D.bonus){D.bonus=1;gain(25);toast('ครบ 3 ภารกิจวันนี้!','+25 บุญ');M.st.dailyFull=1}}
 saveM();
}
function gain(n){M.merit+=n;M.earned+=n;saveM()}

function newGame(cls){
 const P=M.perks,pk=P.pack||0;
 S={cls,day:1,cycle:0,screen:'intro',maxhp:100+(P.hp||0)*10,hp:0,food:80,wat:80,sta:100,san:100,curse:0,power:18,
 inv:{rice:3+pk,water:3+pk,herb:2,salt:3+pk,candle:2,holy:1,band:2,cloth:0,med:0},
 weapon:P.smith?2:1,armor:0,relics:[],allies:{monk:0,yod:0,bua:0},aff:0,buaHostile:0,
 flags:{},visits:{},disrupts:0,act:'search',loc:'market',night:'sleep',queue:[],log:[],combat:null,event:null,ending:null,
 r:{kills:0,holy:0,merit:0}};
 if(cls==='villager'){add('rice',2);add('water',2)}
 if(cls==='mordham'){S.maxhp-=10;add('holy',2);add('candle',3)}

function boss(){return BOSSES[S.cycle%BOSSES.length]}
function victim(){return boss().v}
function save(){store.set('save',S)}
function L(t,c){S.log.push([t,c||''])}
function inv(k){return S.inv[k]||0}
function add(k,n){S.inv[k]=Math.max(0,inv(k)+n)}
function has(r){return S.relics.includes(r)||(r==='eye'&&S.flags.innateEye)}
function curseGain(n){let f=1-S.armor*.15-(M.perks.ward||0)*.07;if(has('yan'))f-=.3;if(S.cls==='rangsong')f-=.25;return Math.max(1,Math.round(n*Math.max(.2,f)))}
function stat(k,n){S[k]=clamp(S[k]+n,0,k==='hp'?S.maxhp:100)}
function gotRelic(r,txt){if(S.relics.includes(r))return;S.relics.push(r);qInc('relic');L(txt+' ✨ ได้ของขลัง: '+RELICS[r],'gold')}
const luck=()=>(M.perks.luck||0)*.06;

/* ---------- DAY FLOW ---------- */
function startDay(){S.log=[];S.queue=['act','event','night','upkeep'];advance()}
function advance(){
 save();
 if(checkDeath())return;
 while(S.queue.length){
  const st=S.queue.shift();
  const r=STEP[st]();
  if(checkDeath())return;
  if(r==='wait'){save();render();return}
 }
 S.screen='report';
 if(S.curse>=95)M.st.cursed=1;
 if(S.day>M.st.maxDay)M.st.maxDay=S.day;
 saveM();save();render();
}
const STEP={
 act(){
  const a=S.act;
  if(a==='rest'){stat('sta',35);stat('hp',10);stat('san',4);L('มึงขังตัวเองอยู่ในกระต๊อบทั้งวัน ปิดประตูลงกลอน นอนฟังเสียงลมหวีดหวิว','good');return}
  if(a==='cave'){S.queue=[];startBoss();return 'wait'}
  const loc=a==='disrupt'?'shrine':S.loc;
  const P=LOC[loc];
  S.visits[loc]=(S.visits[loc]||0)+1;qInc('v_'+loc);
  stat('sta',a==='disrupt'?-28:-20);
  L(`ออกไป${P.n} ${P.i}`);
  if(S.sta<=0){stat('hp',-10);L('แรงหมดจนเข่าทรุด ล้มหัวฟาดพื้น','bad')}
  if(loc==='bamboo'&&S.day>=15&&!S.flags.queenDead&&ch(.09)){L('เสียงระนาดดังมาจากกลางป่าไผ่ ทั้งที่ไม่มีใครอยู่...','bad');startCombat('queen',{after:'queen',loc});return 'wait'}
  const danger=a==='disrupt'?1:P.danger+S.power/300+S.day/200+S.cycle*.05;
  if(ch(danger)){
   let e=pick(P.en);
   if(loc==='swamp'&&e==='phrai'&&S.aff>=2&&!S.buaHostile)e='croc';
   startCombat(e,{after:a==='disrupt'?'disrupt':'loot',loc});
   return 'wait';
  }
  if(a==='disrupt'){afterDisrupt();return}
  doLoot(loc);
 },
 event(){
  const pool=EVENTS.filter(e=>e.when());
  if(!pool.length||!ch(.5))return;
  let tot=pool.reduce((s,e)=>s+(e.w||1),0),r=Math.random()*tot,ev=pool[0];
  for(const e of pool){r-=(e.w||1);if(r<=0){ev=e;break}}
  S.flags['seen_'+ev.id]=(S.flags['seen_'+ev.id]||0)+1;qInc('event');
  S.event={id:ev.id};S.screen='event';return 'wait';
 },
 night(){
  const n=S.night;
  if(n==='pray'&&inv('candle')>0){add('candle',-1);stat('curse',-8);stat('san',9);stat('sta',15);qInc('pray');L('จุดเทียนสวดอิติปิโสจนตีสอง คำสาปบนตัวเบาลง','good')}
  else if(n==='guard'){stat('sta',10);L('นั่งเฝ้ายามกำมีดไว้แน่นทั้งคืน ตาแทบปิด')}
  else{if(n==='pray')L('ไม่มีเทียนเหลือ เลยได้แต่นอน','bad');stat('sta',30);stat('hp',6);L('นอนหลับไปทั้งที่ใจยังเต้นแรง')}
  if(S.allies.monk)stat('curse',-3);
  if(S.allies.bua)stat('san',4);
  let p=.14+S.power/260+S.day/150+S.cycle*.04-(n==='guard'?.12:0)-(has('sai')?.1:0)-(S.allies.bua?.06:0);
  if(ch(clamp(p,.05,.75))){
   const pool=S.day<10?['pret','tayhong','kuman','phong']:S.day<25?['zombie','krasue','kuman','tayhong','pob','nurse']:['krasue','zombie','disciple','phrai','pob','headless'];
   const e=pick(pool);
   L('ตีสาม... มีบางอย่างเคาะประตู','bad');
   startCombat(e,{after:'none',ambush:!(n==='guard'||has('eye'))});
   return 'wait';
  }
 },
 upkeep(){
  const hell=1+S.day/70;
  stat('food',-Math.round(13*hell));stat('wat',-Math.round(17*hell));
  if(S.allies.yod&&S.day%2===0){if(inv('rice')>0){add('rice',-1);L('เสือยอดแดกข้าวไป 1 ถุง "หิวว่ะ"')}else{S.allies.yod=0;L('เสือยอดด่าว่า "แม่งไม่มีแดกก็ไม่อยู่แล้วโว้ย" แล้วเดินหนีไป','bad')}}
  if(S.food<=60&&inv('rice')>0){add('rice',-1);stat('food',38)}
  if(S.wat<=60&&inv('water')>0){add('water',-1);stat('wat',42)}
  if(S.food<=0){stat('hp',-12);L('หิวจนท้องบิด เลือดออกตามไรฟัน','bad')}
  if(S.wat<=0){stat('hp',-18);L('คอแห้งผาก ปัสสาวะเป็นสีน้ำตาล','bad')}
  stat('curse',curseGain(1+Math.floor(S.day/18)+S.cycle));
  stat('san',-1-(S.curse>60?3:0)-(S.cls==='rangsong'?1:0));
  const pw=2+Math.floor(S.day/14)+Math.floor(S.cycle/2);
  stat('power',pw);
  L(`พลังหมอผี +${pw} (ตอนนี้ ${S.power}%)`,'bad');
  qInc('night');
  S.day++;
 }
};
STEP.bua1=()=>{S.event={id:'bua1'};S.screen='event';return 'wait'};
function doLoot(loc){
 const got=[];
 for(const [k,a,b,p] of LOC[loc].loot){if(ch(p+luck())){const n=R(a,b);add(k,n);got.push(`${ITEMS[k]} ×${n}`)}}
 if(loc==='temple'&&S.visits.temple>=2&&ch(.35+luck()))gotRelic('sai','ใต้ฐานพระประธานที่หักพัง มีห่อผ้าแดง ข้างในคือสายสิญจน์เก้าเส้นที่ยังขาวสะอาด');
 if(loc==='grave'&&S.visits.grave>=2&&ch(.3+luck()))gotRelic('takrud','ในโลงไม้ผุมีโครงกระดูกกำตะกรุดไว้แน่น มึงต้องหักนิ้วมันถึงจะเอาออกมาได้');
 if(loc==='swamp'&&!S.flags.metBua){S.flags.metBua=1;S.queue.unshift('bua1')}
 L(got.length?'ได้: '+got.join(', '):'ค้นจนมือพอง ไม่เจออะไรเลย',got.length?'good':'bad');
}
function afterDisrupt(){
 S.disrupts++;M.st.disrupts++;qInc('disrupt');
 const cut=R(14,20);stat('power',-cut);
 L(`มึงเตะกระถางธูป ฉีกผ้ายันต์ เทน้ำมันพรายลงดิน พิธีพัง! พลังหมอผี −${cut}`,'gold');
 if(S.disrupts>=2||ch(.35))gotRelic('knife','บนแท่นพิธีมีมีดหมอด้ามงาช้าง ใบมีดเป็นเหล็กไหลสีดำวาว');
 if(S.weapon<2&&ch(.5)){S.weapon=2;L('คว้าดาบเหล็กน้ำพี้ของลูกศิษย์หมอผีติดมือมาด้วย ⚔️','good')}
 doLoot('shrine');
 stat('curse',curseGain(6));L(`แต่${boss().n.split(' ')[0]}รู้ตัวแล้ว คำสาปตามติดตัวมึงมา`,'bad');
}

/* ---------- COMBAT ---------- */
function startCombat(id,opt){
 const b=EN[id];
 const sc=TUNE.hp+S.day/55+S.cycle*.35;
 const hp=Math.round(b.hp*(id==='queen'?1+S.cycle*.3:sc));
 S.combat={id,hp,max:hp,turn:0,stun:0,log:[],after:opt.after,loc:opt.loc};
 S.screen='combat';
 if(opt.ambush){const d=R(b.atk[0],b.atk[1]);stat('hp',-d);S.combat.log.push([`มันโจมตีก่อนที่มึงจะทันตั้งตัว! −${d} ชีวิต`,'bad'])}
 else S.combat.log.push([b.d,'']);
}
function startBoss(){
 const B=boss();

function cAct(a){
 const C=S.combat,b=EN[C.id],lg=C.log;lg.length=0;
 const shaky=S.san<25&&ch(.28);
 let dmg=0,txt='';
 const gm=x=>b.g===1?x:b.g===0?0:x*.7;
 const big=C.boss||C.id==='queen';
 if(a==='flee'){
  if(big){lg.push(['ไม่มีทางหนีแล้ว','bad'])}
  else if(ch(.3+S.sta/250)){stat('sta',-10);L(`หนีจาก${b.n}มาได้ แต่ทิ้งของที่ค้นไว้หมด`,'bad');S.combat=null;S.screen='plan';return advance()}
  else lg.push(['วิ่งหนีไม่พ้น มันขวางทางไว้','bad']);
 } else if(shaky){lg.push(['มือสั่นจนทำอะไรไม่ถูก เสียงกระซิบในหัวดังเกินไป (สติต่ำ)','bad'])}
 else if(a==='hit'){
  const W=WEAPONS[S.weapon];dmg=R(W.d[0],W.d[1])+(S.cls==='nakleng'?4:0);
  if(S.sta<15)dmg=Math.round(dmg/2);
  if(b.g===1&&!W.holy)dmg=Math.round(dmg*.65);
  if(C.boss&&has('knife'))dmg+=8;
  if(ch(.12)){dmg=Math.round(dmg*1.8);txt=' คริติคอล!'}
  stat('sta',-4);
  lg.push([`ฟันด้วย${W.n} −${dmg}${txt}${b.g===1&&!W.holy?' (อาวุธธรรมดาตีผีเบาลง)':''}`,'good']);
 } else if(a==='salt'){add('salt',-1);qInc('saltUse');dmg=Math.round(gm(R(14,20)));C.stun=b.g&&!big?1:0;lg.push([dmg?`สาดเกลือเสกใส่ มันกรีดร้อง −${dmg}${C.stun?' และชะงักไป 1 ตา':''}`:'สาดเกลือใส่คน มันแค่แสบตาแล้วด่ามึง',dmg?'good':'bad'])}
 else if(a==='holy'){add('holy',-1);S.r.holy++;qInc('holyUse');dmg=b.g?Math.round(gm(R(30,42))):R(4,8);lg.push([`สาดน้ำมนต์ ควันขาวพวยพุ่ง −${dmg}`,'good'])}
 else if(a==='chant'){const md=S.cls==='mordham';stat('san',md?-6:-10);dmg=Math.round(gm(R(12,20))*(md?1.7:1));stat('curse',-5);lg.push([dmg?`ท่องคาถาพระเจ้าห้าพระองค์ −${dmg} คำสาปบนตัว −5`:'ท่องคาถาใส่คน มันไม่สะทกสะท้าน แต่คำสาปบนตัวลดลง −5',dmg?'good':''])}
 else if(a==='black'){dmg=R(24,36);stat('curse',curseGain(7));lg.push([`ท่องคาถาไสยดำ เลือดพุ่งออกจากตาศัตรู −${dmg} แต่คำสาปกัดกินมึงเพิ่ม`,'pink'])}
 else if(a==='band'){add('band',-1);qInc('heal');stat('hp',22);lg.push(['พันแผลห้ามเลือด +22 ชีวิต','good'])}
 else if(a==='herb'){add('herb',-1);qInc('heal');stat('hp',10);stat('curse',-4);lg.push(['เคี้ยวสมุนไพรขมปี๋ +10 ชีวิต −4 คำสาป','good'])}
 else if(a==='med'){add('med',-1);qInc('heal');stat('hp',30);stat('curse',-10);lg.push(['กรอกยาผีบอกลงคอ +30 ชีวิต −10 คำสาป','good'])}
 C.hp-=dmg;
 if(S.allies.yod&&C.hp>0&&a!=='flee'){const y=R(6,13);C.hp-=y;lg.push([`เสือยอดเหวี่ยงขวานใส่ "ตายซะไอ้เหี้ย!" −${y}`,'good'])}
 if(S.allies.bua&&C.hp>0&&a!=='flee'&&ch(.3)){const y=R(8,14);C.hp-=y;lg.push([`บัวลอยโผล่จากเงามืด ข่วนหน้ามันเป็นทางยาว −${y}`,'pink'])}
 if(C.hp<=0)return winCombat();
 C.turn++;
 if(C.stun){C.stun=0;lg.push([`${b.n}ยังชะงักอยู่`,''])}
 else{
  let d=Math.round(R(b.atk[0],b.atk[1])*(big?TUNE.batk:TUNE.atk))+Math.floor(S.day/12)+S.cycle*2;
  if(C.boss&&C.turn%3===0){d+=8;stat('curse',curseGain(12));lg.push(['หมอผีพ่นไสยดำ หนอนไต่ออกจากแผลมึง! คำสาปพุ่ง','bad'])}
  if(C.id==='queen'&&C.turn%3===0){d+=6;stat('food',-15);lg.push(['เจ้าแม่ยื่นลิ้นยาวเป็นวามาดูดเลือด −15 อิ่ม','bad'])}
  d=Math.max(1,d-S.armor*2-(has('takrud')?3:0));
  stat('hp',-d);
  lg.push([`${enemyName()}โจมตี −${d} ชีวิต`,'bad']);
  if(b.curse)stat('curse',curseGain(Math.ceil(b.curse*TUNE.curse)));
  if(b.san)stat('san',-Math.ceil(b.san*.5));
  if(b.sp==='drain'){stat('food',-8);lg.push(['มันดูดเลือดจนตัวเบาหวิว −8 อิ่ม','bad'])}
  if(b.sp==='hex'&&ch(.4)){stat('curse',curseGain(7));lg.push(['มันเป่ามนต์ใส่หน้า คำสาปเพิ่ม','bad'])}
 }
 save();
 if(checkDeath())return;
 render();
 const el=document.querySelector('.enemy');if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
}
function winCombat(){
 const C=S.combat,b=EN[C.id];
 if(S.hp<=5)M.st.clutch=1;
 if(C.boss){
  M.st.bossKills++;qInc('boss');if(S.day<20)M.st.rush=1;if(!S.r.holy)M.st.noholy=1;
  if(S.cycle+1>M.st.endlessMax)M.st.endlessMax=S.cycle+1;
  saveM();S.combat=null;S.event={id:'final'};S.screen='event';save();render();return}
 kill(C.id);
 L(`ฆ่า${b.n}ได้!`,'good');
 if(C.id==='queen'){M.st.queen++;S.flags.queenDead=1;add('med',3);add('holy',2);S.maxhp+=15;stat('hp',15);L('ร่างเจ้าแม่สลายเป็นแผ่นทองคำ มึงกลืนลูกแก้วปอบเข้าไป ชีวิตสูงสุด +15 ได้ยาผีบอก 3 น้ำมนต์ 2','gold')}
 if(C.id==='bandit'&&ch(.5)){add('rice',1);add('band',1);L('ค้นตัวโจรได้ข้าวกับผ้าพันแผล','good')}
 if(C.id==='butcher'&&ch(.5)){add('band',2);L('ในกระเป๋าหมอเถื่อนมีผ้าพันแผล 2 ม้วน','good')}
 if(C.id==='disciple'&&ch(.4)){add('holy',1);L('ลูกศิษย์หมอผีพกน้ำมนต์ขโมยมา ได้น้ำมนต์ 1','good')}
 const after=C.after,loc=C.loc;
 S.combat=null;S.screen='plan';
 if(after==='loot'||after==='queen')doLoot(loc);
 if(after==='disrupt')afterDisrupt();
 advance();
}
function checkDeath(){
 if(S.screen==='end')return true;
 let e=null;
 if(S.hp<=0)e='dead';else if(S.curse>=100)e='ghost';else if(S.san<=0)e='mad';else if(S.power>=100)e='wedding';
 if(e){endGame(e);return true}
 return false;
}

function meritOf(e){return Math.floor(S.day*1.5)+S.r.kills+S.relics.length*4+S.disrupts*3+S.cycle*40+({hero:40,bua:40,dark:40}[e]||0)}
function endGame(e){
 S.ending=e;S.screen='end';
 const m=meritOf(e);S.r.merit=m;gain(m);
 if(S.day>M.st.maxDay)M.st.maxDay=S.day;
 if(!M.st.endings.includes(e))M.st.endings.push(e);
 if(['hero','bua','dark'].includes(e))M.st.wins++;
 if(e==='dark'&&!M.classes.includes('sorcer'))M.classes.push('sorcer');
 saveM();store.del('save');checkAch();render();
}
function nextCycle(){

 S.cycle++;S.day=1;S.power=20+S.cycle*8;S.relics=[];S.disrupts=0;S.visits={};S.flags.queenDead=0;
 S.flags.metBua=S.flags.metBua;S.log=[];S.screen='cycle';
 stat('hp',40);stat('san',30);stat('curse',-30);stat('sta',100);
 save();checkAch();render();
}

 const rl=S.relics.map(r=>`<span class="chip relic">✨ ${RELICS[r]}</span>`).join('');
 const al=[S.allies.monk?'🙏 หลวงตาเปลี่ยน':'',S.allies.yod?'🪓 เสือยอด':'',S.allies.bua?'🪷 บัวลอย':''].filter(Boolean).map(a=>`<span class="chip ally">${a}</span>`).join('');
 return `<div class="card"><h3>ของในย่าม</h3><div class="chips">${it}</div>${rl?`<h3>ของขลัง ${S.relics.length}/5</h3><div class="chips">${rl}</div><p class="muted" style="font-size:12.5px">${S.relics.map(r=>RELIC_FX[r]).join(' · ')}</p>`:''}${al?`<h3>พวกพ้อง</h3><div class="chips">${al}</div>`:''}${S.aff&&!S.allies.bua&&!S.buaHostile?`<p class="muted">ความรักบัวลอย ${'♥'.repeat(S.aff)}${'♡'.repeat(5-S.aff)}</p>`:''}</div>`;
}
let view='home',lastKey='';
function nav(){return `<div class="tabs">${[['home','🏠 หน้าแรก'],['ach','🏆 รางวัล'],['shop','🛕 บุญ'],['daily','📅 รายวัน']].map(([k,t])=>`<button class="btn" aria-pressed="${view===k}" onclick="view='${k}';render()">${t}</button>`).join('')}</div>`}
function homeH(){
 const sv=store.get('save',null),na=Object.keys(M.ach).length;
 if(view==='ach'){
  return nav()+`<div class="card"><h2>Achievement ${na}/${ACH.length}</h2>${ACH.map(([id,i,n,d,t,p])=>{const got=M.ach[id];let pr='';if(!got&&p){const [a,b]=p(M.st);pr=`<div class="prog"><i style="width:${Math.min(100,a/b*100)}%"></i></div><span>${Math.min(a,b)}/${b}</span>`}return `<div class="ach ${got?'':'lock'}"><div class="ai">${got?i:'🔒'}</div><div style="flex:1"><b>${n}</b><span>${d}</span>${pr}</div></div>`}).join('')}</div>`;
 }
 if(view==='shop'){
  return nav()+`<div class="card"><h2>ทำบุญ <span class="merit">🪷 ${M.merit}</span></h2><p class="muted">บุญได้จากทุกครั้งที่ตายหรือชนะ รวมถึง achievement และภารกิจรายวัน ใช้ซื้อของถาวรติดตัวทุกรอบ</p></div>
  <div class="card"><h3>อัปเกรดถาวร</h3>${Object.entries(PERKS).map(([k,p])=>{const lv=M.perks[k]||0,mx=lv>=p.max,c=p.cost[lv];return `<button class="btn" ${mx||M.merit<c?'disabled':''} onclick="buyPerk('${k}')">${p.n} ${'●'.repeat(lv)}${'○'.repeat(p.max-lv)}<small>${p.d} · ${mx?'เต็มแล้ว':'🪷 '+c}</small></button>`}).join('')}</div>
  <div class="card"><h3>อาชีพ</h3>${Object.entries(CLASSES).map(([k,c])=>{const own=M.classes.includes(k);return `<button class="btn" ${own||c.cost<0||M.merit<c.cost?'disabled':''} onclick="buyClass('${k}')">${c.i} ${c.n} ${own?'✓':''}<small>${c.fx} · ${own?'ปลดล็อกแล้ว':c.cost<0?c.d:'🪷 '+c.cost}</small></button>`}).join('')}</div>`;
 }
 if(view==='daily'){
  const D=daily();
  return nav()+`<div class="card"><h2>ภารกิจวันนี้</h2><p class="muted">เปลี่ยนทุกเที่ยงคืน · ข้อละ +15 บุญ · ครบ 3 ข้อได้โบนัส +25</p>${D.ids.map(id=>{const q=QPOOL.find(x=>x.id===id),v=Math.min(D.prog[id]||0,q.n),done=D.done.includes(id);return `<div class="ach ${done?'':''}"><div class="ai">${done?'✅':'⬜'}</div><div style="flex:1"><b>${q.t}</b><div class="prog"><i style="width:${v/q.n*100}%"></i></div><span>${v}/${q.n}</span></div></div>`}).join('')}${D.bonus?'<p class="merit">ครบแล้ววันนี้! 🎉</p>':''}</div>`;
 }
 return `<div class="title-ico">💀👰</div><h1 style="text-align:center">คืนวิวาห์ผี</h1>
 <p class="muted" style="text-align:center">เอาชีวิตรอดสยองขวัญ 18+ · ตายแล้วเริ่มใหม่ แต่บุญติดตัว</p>
 ${nav()}
 ${sv?`<button class="btn pri" onclick="contGame()">เล่นต่อ (คืนที่ ${sv.day}${sv.cycle?' · รอบ '+(sv.cycle+1):''})</button>`:''}
 <button class="btn ${sv?'':'pri'} c" onclick="pickClass()">เริ่มเกมใหม่</button>
 <div class="card"><p>🪷 บุญ <b class="merit">${M.merit}</b> · 🏆 ${na}/${ACH.length} · รอดไกลสุดคืนที่ ${M.st.maxDay}</p><p class="muted">ฆ่าไปแล้ว ${M.st.total} ตัว · เล่น ${M.st.runs} รอบ · ชนะ ${M.st.wins} · ฉากจบ ${M.st.endings.length}/7 · ไม่รู้จบไกลสุด ${M.st.endlessMax} รอบ</p></div>
 <div class="card story"><p>หมู่บ้านหนองผีถูกสาป หมอผีแห่งเขาดำลักตัวหญิงสาวไปทำ <b>วิวาห์ผี</b> ในคืนที่ 49 ออกหาของ ขัดพิธี เก็บของขลังให้ได้ 3 ชิ้นแล้วบุกถ้ำ ฆ่าหมอผีได้แล้วจะเลิกหรือไล่ล่าตัวต่อไปแบบไม่รู้จบก็ได้</p></div>
 <p class="foot">มีความรุนแรง สยองขวัญ คำหยาบ และเนื้อหายั่วยวนแบบไม่โจ่งแจ้ง · เซฟในเบราว์เซอร์นี้</p>`;
}
function pickClass(){
 const sv=store.get('save',null);
 if(sv&&!pickArmed){pickArmed=1;toast('มีเซฟค้างอยู่','แตะเริ่มเกมใหม่อีกครั้งเพื่อทิ้งเซฟเก่า');return}
 pickArmed=0;S=null;view='class';render();
}
let pickArmed=0;
function buyPerk(k){const p=PERKS[k],lv=M.perks[k]||0;if(lv>=p.max||M.merit<p.cost[lv])return;M.merit-=p.cost[lv];M.perks[k]=lv+1;saveM();checkAch();render()}
function buyClass(k){const c=CLASSES[k];if(M.classes.includes(k)||c.cost<0||M.merit<c.cost)return;M.merit-=c.cost;M.classes.push(k);saveM();render()}
function render(){
 if(S)checkAch();
 const sc=S?S.screen:(view==='class'?'class':'title');
 let h='';
 if(sc==='title')h=homeH();
 else if(sc==='class'){
  h=`<h2>เลือกอาชีพ</h2>${Object.entries(CLASSES).map(([k,c])=>{const own=M.classes.includes(k);return `<button class="btn" ${own?'':'disabled'} onclick="newGame('${k}');render()">${c.i} ${c.n}${own?'':' 🔒'}<small>${c.d} · ${c.fx}</small></button>`}).join('')}<button class="btn c" onclick="view='home';render()">ย้อนกลับ</button>`;
 }
 else if(sc==='intro'){
  h=`<div class="card story"><h2>คืนที่ 1</h2><p>มึงกลับมาถึงหมู่บ้านตอนพลบค่ำ บ้านทุกหลังปิดเงียบ หมาไม่เห่าสักตัว บนประตูบ้าน${victim()}มีรอยมือเปื้อนเลือดสีดำ กับผ้ายันต์ที่เขียนว่า <b>"วันวิวาห์ คืนที่สี่สิบเก้า"</b></p><p>มึงมีแค่ย่ามข้าว กระต๊อบโทรมๆ ท้ายหมู่บ้าน และความแค้น</p></div>
  <div class="card"><h3>วิธีรอด</h3><p>• ทุกวันเลือก 1 อย่าง แล้วเลือกว่าคืนนี้จะทำอะไร<br>• <b>คำสาป</b> 100 = กลายเป็นผี · <b>สติ</b> หมด = บ้า · <b>พลังหมอผี</b> 100 = แพ้<br>• อาวุธธรรมดาตีผีเบาลง ใช้เกลือเสก น้ำมนต์ คาถา<br>• ขัดพิธีที่ศาลหมอผีเพื่อกดพลังมันลง<br>• มีของขลัง 3 ชิ้นขึ้นไป บุกถ้ำเขาดำได้เลย<br>• ระวังป่าไผ่หลังคืนที่ 15...</p></div>
  <button class="btn pri" onclick="S.screen='plan';save();render()">เริ่ม</button>`;
 }
 else if(sc==='cycle'){
  h=`<div class="card story"><h2>♾️ รอบที่ ${S.cycle+1}</h2><p>สามวันหลังงานศพหมอผี มีคนวิ่งมาจากหมู่บ้านถัดไป หน้าซีดเหมือนกระดาษ "<b>${boss().n}</b> ตื่นแล้ว มันเอาตัว<b>${victim()}</b>ไป!"</p><p>${boss().d}</p><p>ของขลังเก่าแตกสลายไปหมดหลังศึกครั้งก่อน มึงต้องเริ่มหาใหม่ และหมอผีตัวนี้แข็งกว่าเดิม</p><p class="merit">+40 บุญจากการปราบหมอผี</p></div><button class="btn pri" onclick="S.screen='plan';save();render()">ออกล่า</button>`;
 }
 else if(sc==='plan'){
  const final=S.day>=49,canCave=S.relics.length>=3||final;
  const acts=final?[['cave','☠️ คืนวิวาห์มาถึงแล้ว บุกถ้ำเขาดำ','ไม่มีทางเลือกอื่นแล้ว']]:[
   ['search','🔦 ออกค้นหาของ','แรง −20 · อาจเจอศัตรู'],
   ['disrupt','🔥 บุกขัดพิธีที่ศาลหมอผี','แรง −28 · สู้แน่นอน · พลังหมอผี −14~20'],
   ['rest','🛏️ พักฟื้นทั้งวัน','แรง +35 ชีวิต +10'],
   ...(canCave?[['cave','☠️ บุกถ้ำเขาดำ (สู้บอส)',`ของขลัง ${S.relics.length} ชิ้น · ไม่มีทางถอย`]]:[])];
  if(final)S.act='cave';
  if(S.act==='cave'&&!canCave)S.act='search';
  const NT={sleep:['😴','นอน','แรง +30 ชีวิต +6 · ถ้าผีบุกจะโดนตีก่อน'],guard:['👁️','เฝ้ายาม','แรง +10 · ผีบุกน้อยลงและไม่โดนซุ่ม'],pray:['🕯️','สวดมนต์',`ใช้เทียน 1 (มี ${inv('candle')}) · คำสาป −8 สติ +9 แรง +15`]};
  const actLbl=S.act==='search'?LOC[S.loc].i+' '+LOC[S.loc].n:S.act==='disrupt'?'🔥 ขัดพิธีที่ศาล':S.act==='rest'?'🛏️ พักทั้งวัน':'☠️ บุกถ้ำเขาดำ';
  const mini=(v,mx,c)=>`<div class="mtrack"><i style="width:${v/mx*100}%;background:${c}"></i></div>`;
  h=`<div class="sticky"><div class="sb-row"><button class="icon" aria-label="หน้าแรก" onclick="S=null;view='home';render()">🏠</button>
   <div class="sb-info"><b>คืนที่ ${Math.min(S.day,49)}/49${S.cycle?' · ♾️'+(S.cycle+1):''}</b><span>${actLbl}${S.act!=='cave'?' · '+NT[S.night][0]+' '+NT[S.night][1]:''}</span></div>
   <button class="btn pri go" onclick="startDay()">${S.act==='cave'?'เข้าถ้ำ ☠️':'เริ่มวัน ▶'}</button></div>
   <div class="minis"><span>❤️</span>${mini(S.hp,S.maxhp,'var(--red)')}<span>🟣</span>${mini(S.curse,100,'var(--purple)')}<span>🧿</span>${mini(S.power,100,'#e0303a')}</div></div>`
  +statsH()+`<div class="card"><h3>☀️ กลางวันทำอะไร</h3><div class="grid2">${acts.map(([k,t,d])=>`<button class="btn tile ${k==='cave'?'span2':''}" aria-pressed="${S.act===k}" onclick="S.act='${k}';render()">${t}<small>${d}</small></button>`).join('')}</div>
  ${S.act==='search'?`<h3>📍 ไปที่ไหน</h3><div class="grid2">${SEARCH_LOCS.map(k=>`<button class="btn tile loc" aria-pressed="${S.loc===k}" onclick="S.loc='${k}';render()"><span class="li">${LOC[k].i}</span>${LOC[k].n}<small>${LOC[k].d}</small></button>`).join('')}</div>`:''}
  </div>
  ${S.act!=='cave'?`<div class="card"><h3>🌙 คืนนี้</h3><div class="seg">${Object.entries(NT).map(([k,[i,t]])=>`<button class="btn" aria-pressed="${S.night===k}" ${k==='pray'&&!inv('candle')?'disabled':''} onclick="S.night='${k}';render()">${i} ${t}</button>`).join('')}</div><p class="muted" style="font-size:13px">${NT[S.night][2]}</p></div>`:''}
  <details class="card" ${craftMsg?'open':''}><summary>🧪 ทำของ / ลงอาคม ${CRAFT.filter(c=>c.ok()).length?`<span class="badge">${CRAFT.filter(c=>c.ok()).length}</span>`:''}</summary>${CRAFT.map((c,i)=>`<button class="btn" ${c.ok()?'':'disabled'} onclick="doCraft(${i})">${c.n}<small>${c.d}</small></button>`).join('')}${craftMsg?`<p style="color:#bfe3bb">${craftMsg}</p>`:''}</details>
  ${invH()}`;
 }
 else if(sc==='combat'){
  const C=S.combat,b=EN[C.id];
  const nm=C.boss?boss().n:b.n;
  h=`<div class="enemy"><div class="ico">${b.i}</div><h2>${nm}</h2><div class="bar" style="margin-top:8px"><div class="lab"><span>${b.g===1?'ผี':b.g===0?'คน':'ครึ่งคนครึ่งผี'}</span><b>${Math.max(0,C.hp)} / ${C.max}</b></div><div class="track"><div class="fill" style="width:${Math.max(0,C.hp/C.max*100)}%;background:var(--red)"></div></div></div></div>
  <div class="card log">${C.log.map(([t,c])=>`<p class="${c}">${t}</p>`).join('')}</div>
  <div class="bars card">${barH('hp','var(--red)')}${barH('sta','var(--gold)')}${barH('san','var(--green)')}${barH('curse','var(--purple)')}</div>
  <div class="grid2">
   <button class="btn" onclick="cAct('hit')">⚔️ ฟัน<small>${WEAPONS[S.weapon].n}</small></button>
   <button class="btn" ${inv('salt')?'':'disabled'} onclick="cAct('salt')">🧂 เกลือเสก ${inv('salt')}<small>ผีชะงัก 1 ตา</small></button>
   <button class="btn" ${inv('holy')?'':'disabled'} onclick="cAct('holy')">💧 น้ำมนต์ ${inv('holy')}<small>แรงมากกับผี</small></button>
   <button class="btn" ${S.san>10?'':'disabled'} onclick="cAct('chant')">📿 คาถา<small>สติ −${S.cls==='mordham'?6:10} · คำสาป −5</small></button>
   ${S.cls==='sorcer'?`<button class="btn" onclick="cAct('black')">🩸 ไสยดำ<small>24–36 ทุกศัตรู · คำสาปขึ้น</small></button>`:''}
   <button class="btn" ${inv('band')?'':'disabled'} onclick="cAct('band')">🩹 ผ้าพันแผล ${inv('band')}<small>+22 ชีวิต</small></button>
   <button class="btn" ${inv('med')||inv('herb')?'':'disabled'} onclick="cAct(inv('med')?'med':'herb')">🌿 ${inv('med')?'ยาผีบอก '+inv('med'):'สมุนไพร '+inv('herb')}<small>${inv('med')?'+30 ชีวิต −10 คำสาป':'+10 ชีวิต −4 คำสาป'}</small></button>
  </div>
  ${C.boss||C.id==='queen'?'':`<button class="btn c" onclick="cAct('flee')">🏃 หนี (ทิ้งของ)</button>`}`;
 }
 else if(sc==='event'){
  curEv=getEvent();
  h=`<div class="card story"><h2>${curEv.t}</h2><p>${curEv.s}</p></div>${curEv.o.map((o,i)=>`<button class="btn" onclick="chooseEv(${i})">${o[0]}</button>`).join('')}`;
 }
 else if(sc==='report'){
  h=`<button class="btn pri" onclick="S.screen='plan';craftMsg='';save();render()">ไปคืนที่ ${S.day} →</button><div class="card"><h2>สรุปวัน</h2><div class="log">${S.log.map(([t,c])=>`<p class="${c}">${t}</p>`).join('')}</div></div>`+statsH()+`<button class="btn pri" onclick="S.screen='plan';craftMsg='';save();render()">คืนที่ ${S.day} →</button>`;
 }
 else if(sc==='end'){
  const E=ENDINGS[S.ending],good=['hero','bua','dark'].includes(S.ending);
  h=`<div class="title-ico">${E.i}</div><h1 style="text-align:center;color:${good?'var(--gold)':'var(--red)'}">${E.t}</h1>
  <div class="card story"><p>${E.s()}</p></div>
  <div class="card"><p class="merit" style="font-size:20px">+${S.r.merit} บุญ 🪷</p><p>คืนที่ ${Math.min(S.day,49)}${S.cycle?' · รอบไม่รู้จบ '+(S.cycle+1):''} · ฆ่า ${S.r.kills} ตัว · ของขลัง ${S.relics.length}/5 · ขัดพิธี ${S.disrupts} ครั้ง</p>${S.log.length&&!good?`<div class="log">${S.log.slice(-4).map(([t,c])=>`<p class="${c}">${t}</p>`).join('')}</div>`:''}</div>
  <button class="btn pri" onclick="S=null;view='class';render()">เริ่มใหม่</button><button class="btn c" onclick="S=null;view='shop';render()">ไปทำบุญ (อัปเกรด)</button><button class="btn c" onclick="S=null;view='home';render()">หน้าแรก</button>`;
 }
 $app.innerHTML=h;
 const key=sc+(S?S.day+':'+(S.combat?1:0):view);if(key!==lastKey){window.scrollTo(0,0);lastKey=key}
}
function contGame(){S=store.get('save',null);if(!S){render();return}if(!S.r)S.r={kills:0,holy:0,merit:0};if(!S.maxhp)S.maxhp=100;if(!S.cls)S.cls='villager';if(S.cycle==null)S.cycle=0;render()}
daily();render();
</script>
</body>
</html>
